apiVersion: v1
kind: Namespace
metadata: {name: e2e}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: s3, namespace: e2e}
spec:
  selector: {matchLabels: {app: s3}}
  template:
    metadata: {labels: {app: s3}}
    spec:
      nodeSelector: {e2e-infra: "true"}
      containers:
        - name: s3
          image: ACR.azurecr.io/fakes3:2
          ports: [{containerPort: 9000}]
---
apiVersion: v1
kind: Service
metadata: {name: s3, namespace: e2e}
spec:
  selector: {app: s3}
  ports: [{port: 9000}]
---
apiVersion: v1
kind: Secret
metadata: {name: s3-creds, namespace: e2e}
stringData: {accessKeyId: e2e, secretAccessKey: e2e-secret}
---
apiVersion: v1
kind: Pod
metadata: {name: cli, namespace: e2e}
spec:
  nodeSelector: {e2e-infra: "true"}
  containers:
    - name: cli
      image: redis:8
      command: ["sleep", "infinity"]
---
apiVersion: v1
kind: Pod
metadata: {name: curl, namespace: e2e}
spec:
  nodeSelector: {e2e-infra: "true"}
  containers:
    - name: curl
      image: curlimages/curl:8.11.1
      command: ["sleep", "infinity"]
