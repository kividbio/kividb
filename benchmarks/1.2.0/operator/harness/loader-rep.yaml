apiVersion: apps/v1
kind: Deployment
metadata: {name: loader-rep, namespace: e2e}
spec:
  selector: {matchLabels: {app: loader-rep}}
  template:
    metadata: {labels: {app: loader-rep}}
    spec:
      nodeSelector: {e2e-infra: "true"}
      containers:
        - name: loader
          image: ACR.azurecr.io/e2e-loader:6
          env: [{name: ADDR, value: "rep-master.e2e.svc:6380"}, {name: PREFIX, value: "g4"}, {name: OPENLOOP, value: "1"}, {name: OPTIMEOUT, value: "5000"}, {name: MODE, value: single}, {name: WORKERS, value: "4"}, {name: RATE, value: "800"}, {name: PASSWORD, value: "pw-one-1111"}]
          ports: [{containerPort: 8080}]
---
apiVersion: v1
kind: Service
metadata: {name: loader-rep, namespace: e2e}
spec:
  selector: {app: loader-rep}
  ports: [{port: 8080}]
