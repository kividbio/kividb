# fx: a separate sharded cluster (3 x (1+1)), created on rc7 and upgraded to rc8 (the rc7 -> rc8 upgrade check) for the force-delete repro, with its own loader
apiVersion: kividb.io/v1alpha1
kind: KividbCluster
metadata: {name: fx, namespace: e2e}
spec: {shards: 3, replicas: 1, image: "ghcr.io/kividbio/kividb:v1.2.0-rc7", storage: {size: 5Gi}, aclConfigRef: {name: shd-acl}}
