apiVersion: apps/v1
kind: Deployment
metadata: {name: loader-shd, namespace: e2e}
spec:
  selector: {matchLabels: {app: loader-shd}}
  template:
    metadata: {labels: {app: loader-shd}}
    spec:
      nodeSelector: {e2e-infra: "true"}
      containers:
        - name: loader
          image: ACR.azurecr.io/e2e-loader:6
          env: [{name: ADDR, value: "shd.e2e.svc:6380"}, {name: PREFIX, value: "g4"}, {name: OPENLOOP, value: "1"}, {name: OPTIMEOUT, value: "5000"}, {name: MODE, value: cluster}, {name: WORKERS, value: "4"}, {name: RATE, value: "800"}, {name: PASSWORD, value: "shd-pw-1111"}]
          ports: [{containerPort: 8080}]
---
apiVersion: v1
kind: Service
metadata: {name: loader-shd, namespace: e2e}
spec:
  selector: {app: loader-shd}
  ports: [{port: 8080}]
