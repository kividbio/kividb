[lib]
name = "kividb"
path = "src/lib.rs"

[[bin]]
name = "kividb"
path = "src/main.rs"

[package]
name = "kividb"
version = "1.2.1-rc2"
edition = "2024"
description = "A fast Redis®-compatible in-memory store written in Rust"
license = "AGPL-3.0-only"
authors = ["KIVIDB PRIVATE LIMITED"]
homepage = "https://kividb.io"
readme = "README.md"
repository = "https://github.com/kividbio/kividb"
keywords = ["redis", "database", "in-memory", "resp", "cache"]
categories = ["database-implementations", "caching"]
# The oldest toolchain the crate is checked against: the Dockerfile's.
rust-version = "1.89"
# What `cargo publish` uploads: the sources and the files a build or the
# library's own unit tests read. Benchmarks, integration tests, docs, scripts
# and media stay in the repository (the crate limit is 10 MB; all of git is
# over 200 MB).
include = [
    "/src/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/NOTICE",
    # Read by unit tests in src/commands/hyperloglog.rs.
    "/tests/fixtures/redis-8.0-hll-small-sparse.bin",
    "/tests/fixtures/redis-8.0-hll-sparse-12304.bin",
    "/tests/fixtures/kividb-legacy-hll-abc.bin",
]

# `cargo binstall kividb` downloads the release's tarball (the default build)
# instead of compiling. Each tarball holds kividb/kividb, kividb/LICENSE and
# kividb/NOTICE. Other targets compile from source; quick-install (builds by
# a third party) is not used.
[package.metadata.binstall]
pkg-fmt = "tgz"
bin-dir = "kividb/{ bin }{ binary-ext }"
disabled-strategies = ["quick-install"]

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/kividb-linux-x86_64.tar.gz"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/kividb-linux-aarch64.tar.gz"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/kividb-darwin-x86_64.tar.gz"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/kividb-darwin-aarch64.tar.gz"

# docs.rs: the library is the server's internals (see src/lib.rs). One Linux
# build, the default features.
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[package.metadata.deb]
name = "kividb"
maintainer = "KiviDB Private Limited"
section = "database"
priority = "optional"
depends = "$auto"

[dependencies]
memchr = "2"
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"
ahash = "0.8"
# Hashes keep their fields in insertion order, as Redis's listpack does.
indexmap = "2"
socket2 = { version = "0.5", features = ["all"] }
clap = { version = "4", features = ["derive"] }
clap_lex = "1"
libc = "0.2.183"
rand = "0.8"
# `float_roundtrip`: a number is read as the double nearest to it. Without
# it, one that needs 17 digits was often read as its neighbour (#445).
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
ordered-float = "4"
sha2 = "0.10"
lzf = "0.3"
bitflags = "2.6"
either = "1"
# ARGREP's `RE <pattern>` predicate (Redis 8.8 array commands). Linear-time
# engine with no backtracking, so a client-supplied pattern can't be turned into
# a CPU denial-of-service the way a backtracking engine allows.
#
# `regex-lite`, not `regex`: the full engine contributed 553 KB of `.text`
# (65% of this release's total binary growth), and with `lto = "fat"` the hot
# command path is already ~130 KB against a 64 KB L1i — that much extra code
# measurably worsens instruction-cache pressure on the benchmark's hot loop.
# regex-lite has the same `Regex::new` / `is_match` surface and the same
# linear-time guarantee; it trades match throughput for size, which is the right
# trade for ARGREP (a scan command, not a hot path).
regex-lite = "0.1"
tokio-rustls  = { version = "0.26", optional = true }
rustls-pemfile = { version = "2",   optional = true }
# The names in a client certificate, for `tls-auth-clients-allowed-names`:
# the X.509 parser rustls already builds with.
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["std"], optional = true }
mlua = { version = "0.10", features = ["lua54", "vendored", "send"], optional = true }
sha1 = { version = "0.10", optional = true }
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
# The startup update check (src/update_check.rs): one HTTPS request to
# kividb.io. The provider is aws-lc-rs, the one the `tls` feature's server
# already uses, so a build with both has a single crypto provider; the roots
# are compiled in, so it works in images without a CA bundle.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
webpki-roots = "1"
# Snowball stemmers for TEXT fields (`src/vector/stem.rs`), the algorithms
# RediSearch stems with. MIT/BSD-3-Clause, no dependencies of its own.
rust-stemmers = "=1.2.0"
hashbrown = { version = "0.17", default-features = false }
boxcar = "0.2"

[features]
tls = ["dep:tokio-rustls", "dep:rustls-pemfile", "dep:webpki"]
# The builds with Lua use mimalloc (on Linux): see `mimalloc` below.
lua = ["dep:mlua", "dep:sha1", "mimalloc"]
# `mimalloc`: mimalloc under the counting allocator, on Linux. Part of the
# builds with Lua, and not of the default build.
#
# Scripts are what it is for. A script allocates and frees a few hundred
# small blocks, and with scripts running on several threads at once
# (`lua-parallel-scripts`) a block is as a rule freed by another thread than
# the one that allocated it, which glibc's malloc takes a lock for: four
# job queues on four cores processed 6,100 jobs a second with glibc and
# 10,800 with mimalloc, the server's CPU time a third less.
#
# For plain commands on one thread it changes little either way (about 60
# instructions fewer a GET, 640 more a 1 KB SET), and the default build, which
# is the one measured against other engines, keeps the system allocator until
# it has been measured there on a machine with many cores.
mimalloc = ["dep:mimalloc"]

[target.'cfg(target_os = "macos")'.dependencies]
mach2 = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
tokio-uring = "0.5"
# Behind the `mimalloc` feature: see there.
mimalloc = { version = "0.1", default-features = false, optional = true }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[dev-dependencies]
tempfile = "3"
libc = "0.2"
rcgen = "0.13"
tokio = { version = "1", features = ["test-util"] }
