# Template for the `kividb` package, the default build (no Lua, no TLS).
# packaging/nfpm-config.sh writes the file nfpm is given, for this package or
# for `kividb-full` (the full build: Lua and TLS), with the version and the
# architecture: see .github/workflows/release.yml.
name: kividb
arch: amd64
version: 0.0.0
maintainer: "KIVIDB PRIVATE LIMITED <support@kividb.io>"
vendor: "KIVIDB PRIVATE LIMITED"
homepage: "https://github.com/kividbio/kividb"
description: "Fast Redis-compatible in-memory store written in Rust."
license: "AGPL-3.0-only"
scripts:
  preinstall: ./packaging/scripts/preinstall.sh
  postinstall: ./packaging/scripts/postinstall.sh
  preremove: ./packaging/scripts/preremove.sh
# posttrans: run once a whole dnf transaction is done. After `dnf swap`, the
# package going away has stopped the unit only after this one's %post ran
# (see preinstall.sh and preremove.sh).
# xz, not gzip: about 14% smaller (5.9 MB for 6.8 MB, the default build's
# .deb), for the repositories' size limit (package-repos.yml, KEEP). Every
# dpkg and rpm the packages support (glibc 2.34 and newer) reads it.
rpm:
  compression: xz
  scripts:
    posttrans: ./packaging/scripts/posttrans.sh
deb:
  compression: xz
# `kividb` and `kividb-full` install the same files (the binary, the unit,
# the config), so only one of them can be installed; installing the other
# replaces it. Replaces is for deb only: nfpm writes `replaces` as rpm's
# Obsoletes, and with that dnf would trade one for the other on every
# upgrade. `dnf swap` does it when asked.
conflicts:
  - kividb-full
# The binary is built on Amazon Linux 2023 and needs its glibc, 2.34, or newer:
# Debian 12, Ubuntu 22.04, RHEL 9 and Fedora 35 or later. Saying so makes apt
# and dnf refuse an older system rather than install a server that cannot
# start. The pre-install script makes the kividb user with groupadd and
# useradd, which minimal RPM-based images such as amazonlinux:2023 leave out.
overrides:
  deb:
    depends:
      - libc6 (>= 2.34)
    replaces:
      - kividb-full
  rpm:
    depends:
      - shadow-utils
      - glibc >= 2.34
contents:
  - src: ./target/release/kividb
    dst: /usr/bin/kividb
    file_info:
      mode: 0755
  # KiviDB is licensed under the GNU Affero General Public License v3 (AGPL-3.0-only),
  # as in the release tarballs.
  - src: ./LICENSE
    dst: /usr/share/doc/kividb/LICENSE
  - src: ./NOTICE
    dst: /usr/share/doc/kividb/NOTICE
    file_info:
      mode: 0644
  # A packaged daemon needs a unit to start it and an unprivileged user to run
  # as, and its data needs a home of its own.
  - src: ./packaging/kividb.service
    dst: /usr/lib/systemd/system/kividb.service
    file_info:
      mode: 0644
  # The config can hold requirepass, and CONFIG REWRITE writes a temporary file
  # beside it and renames that over the file, so the directory has to belong to
  # the server user as well as the file.
  - dst: /etc/kividb
    type: dir
    file_info:
      mode: 0750
      owner: kividb
      group: kividb
  - src: ./packaging/kividb.conf
    dst: /etc/kividb/kividb.conf
    type: config|noreplace
    file_info:
      mode: 0640
      owner: kividb
      group: kividb
  - dst: /var/lib/kividb
    type: dir
    file_info:
      mode: 0750
      owner: kividb
      group: kividb
