# KiviDB configuration file. One directive per line; a flag on the command line
# wins over the same directive here.
# Reference: https://github.com/kividbio/kividb#configuration

# Loopback only. A Redis-compatible server with no password is the usual way
# these end up compromised. To accept remote clients, set a password
# (requirepass, or an ACL user) and change this line.
bind 127.0.0.1

# 6380, not 6379, so this can run beside a Redis on the same host.
port 6380

# Where dump.kdb, appendonly.aof, backups and nodes.conf live. systemd creates
# the directory and gives it to the kividb user.
dir /var/lib/kividb

# A packaged server does not need to ask GitHub whether it is current; the
# package manager already tells the operator that. See docs/UPDATE_CHECK.md.
update-check no

# Persistence is a deployment decision, not a packaging one. Uncomment to keep
# the dataset across restarts:
# appendonly yes

# HyperLogLog values written from now on: "legacy" (the default, readable by
# releases before 1.2.0) or "redis". Existing values keep their format. Switch
# every node of a deployment together; see docs/PERSISTENCE.md.
# hll-write-format legacy
