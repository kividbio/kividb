name: Refresh images

# Rebuilds a released version's Docker images on the newest build of the
# runtime base, with the Debian security updates published since the
# release, and points the version's tags (in GHCR and Docker Hub) at the
# result. The kividb binary, its home directory and licence files are the
# release's own, byte for byte: docker/refresh/Dockerfile moves them from
# each per-arch image onto the new base (distroless has no package manager to
# upgrade with in place).
#
# Why not just release a patch version: a scanner flags the version people
# already run, and the fix is in Debian's packages, not in kividb. The
# version's tags change digest; anyone who pinned a digest keeps the old one.
#
# The same Trivy gate as the release: a critical or high CVE with a fix still
# unapplied stops the run before any public tag moves. `MAJOR.MINOR` and
# `latest` move only when the tag is the latest stable release.
#
# Each run overwrites the per-arch GHCR tags it read; their digests before
# the run are in the job summary, for a rollback.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Released tag whose images to refresh (e.g. v1.1.0)"
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event.inputs.tag }}
  TRIVY: aquasec/trivy:0.58.1

jobs:
  per-arch:
    name: ${{ matrix.variant }} (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        variant: [default, lua, tls, full]
        arch: [amd64, arm64]
    steps:
      - name: Check the tag is a stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG is not a stable version tag"; exit 1; }
          gh release view "$TAG" --repo "${{ github.repository }}" --json tagName >/dev/null

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the released image
        id: base
        run: |
          set -euo pipefail
          infix=""
          [ "${{ matrix.variant }}" = default ] || infix="${{ matrix.variant }}-"
          image="ghcr.io/${{ github.repository }}:${TAG}-${infix}${{ matrix.arch }}"
          digest=$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' | jq -r .digest)
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "base=${image%:*}@${digest}" >> "$GITHUB_OUTPUT"
          echo "\`$image\` was \`$digest\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Build with the Debian updates
        uses: docker/build-push-action@v6
        with:
          context: docker/refresh
          platforms: linux/${{ matrix.arch }}
          build-args: BASE=${{ steps.base.outputs.base }}
          pull: true
          load: true
          tags: kividb-refresh:local

      - name: Scan
        run: |
          set -euo pipefail
          trivy() {
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              "$TRIVY" image --quiet --image-src docker --scanners vuln "$@" kividb-refresh:local
          }
          trivy --format table
          trivy --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 --format table

      - name: Check it is still the released kividb
        run: |
          set -euo pipefail
          docker run --rm --entrypoint kividb kividb-refresh:local --version | grep -F "kividb ${TAG#v}"

      - name: Push the per-arch image
        env:
          IMAGE: ${{ steps.base.outputs.image }}
        run: |
          docker tag kividb-refresh:local "$IMAGE"
          docker push "$IMAGE"

  manifests:
    needs: per-arch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Point the version's tags at the refreshed images
        env:
          GH_TOKEN: ${{ github.token }}
          SRC: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          MAJOR_MINOR="${VER%.*}"
          LATEST=$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name)

          for registry in "${SRC}" "docker.io/kividb/kividb"; do
            for variant in default lua tls full; do
              infix=""
              [ "$variant" = default ] || infix="${variant}-"
              srcs=("${SRC}:${TAG}-${infix}amd64" "${SRC}:${TAG}-${infix}arm64")
              if [ "$variant" = default ]; then
                tags=("${registry}:${TAG}")
                if [ "$TAG" = "$LATEST" ]; then
                  tags+=("${registry}:${MAJOR_MINOR}" "${registry}:latest")
                fi
              else
                tags=("${registry}:${TAG}-${variant}")
              fi
              for t in "${tags[@]}"; do
                docker buildx imagetools create -t "$t" "${srcs[@]}"
                echo "- \`$t\`" >> "$GITHUB_STEP_SUMMARY"
              done
            done
          done
