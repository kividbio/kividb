name: CI

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.config/nextest.toml'
      - 'scripts/redis_compat*'
      - '.github/workflows/ci.yml'
      # The regression suite's harness and the release gate (python only:
      # the `regression-selftest` job; nothing is built for them).
      - 'benchmarks/*/regressions/**'
      - 'scripts/release/**'
  # By hand, from the Actions tab: the full build and test of a branch, e.g.
  # master before a release tag. Skips the change detection below.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# A new push to a pull request stops the runs of the commit it replaces. Only
# for pull requests: a manual run is never cancelled, and each has a group of
# its own.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Cheap gate: only build/test if real source changed ───────────────────
  # The `paths:` filter above includes this workflow file itself, so that
  # editing ci.yml still gets a real check -- but without this job, every
  # such edit also re-runs the full build+test+e2e+redis-compat cycle.
  detect-changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # dorny/paths-filter fetches the PR's changed-files list from the
    # GitHub API on pull_request events, which needs pull-requests: read --
    # the repo's default GITHUB_TOKEN permissions don't include it, and
    # this job is the only one in this workflow that needs it, so it's
    # scoped here rather than granted workflow-wide.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_ci: ${{ steps.filter.outputs.source }}
      harness: ${{ steps.filter.outputs.harness }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Diffed against the PR's merge base, not the previous push: a push
          # cancels the run of the one before it (see `concurrency` above), so
          # "what did this push touch" would lose a source change whose run
          # was cancelled by a workflow-only push.
          filters: |
            source:
              - 'src/**'
              - 'tests/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.config/nextest.toml'
              - 'scripts/redis_compat*'
              - '.github/workflows/ci.yml'
              - '.github/workflows/linux-verification.yml'
            harness:
              - 'benchmarks/*/regressions/lib/**'
              - 'benchmarks/*/regressions/suites/**'
              - 'benchmarks/*/regressions/run-all.sh'
              - 'scripts/release/**'
              - '.github/workflows/ci.yml'

  # ── The regression suite's self-tests: python only, no VM, seconds ────────
  # compare.py's gates and host scaling, the release gate
  # (scripts/release/regression_gate.py) and suite 25's error check, and that
  # every suite lists its configurations.
  regression-selftest:
    needs: detect-changes
    if: >-
      always() && needs.detect-changes.result != 'failure' &&
      (github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.harness == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Self-tests
        run: |
          set -euo pipefail
          for d in benchmarks/*/regressions; do
            [ -f "$d/lib/test_compare.py" ] || continue
            (cd "$d/lib" && python3 -m unittest -v test_compare $( [ -f test_suite25.py ] && echo test_suite25 ))
            for f in "$d"/suites/[0-9][0-9]-*.py; do python3 "$f" --configs > /dev/null; done
            bash -n "$d/run-all.sh"
          done
          bash -n scripts/release/check-regression-results.sh

  # -- What `rust` used to do in one 41-minute job, as parallel jobs ---------
  # `cargo test` compiled and ran 75 test binaries one after the other. Now the
  # tests are compiled ONCE into a nextest archive and run in SHARDS from it,
  # so the shards add runners but no compiles. `rust` at the end is the single
  # job the branch ruleset requires: it fails if any of these did.

  lint:
    needs: detect-changes
    if: >-
      always() && needs.detect-changes.result != 'failure' &&
      (github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.run_ci == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  build-tests:
    needs: detect-changes
    if: >-
      always() && needs.detect-changes.result != 'failure' &&
      (github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.run_ci == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # No debug info in the test binaries: they are uploaded once and
      # downloaded by every shard, and the archive is several times smaller
      # without it. A panic still says where it happened.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Pinned by commit, as setup-uv is in smoke-test.yml.
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: nextest@0.9.150

      - name: Build the tests (once, for every shard)
        run: cargo nextest archive --features lua,tls --archive-file nextest-archive.tar.zst

      # nextest does not run doctests. There are none today; this keeps it so.
      - name: Doctests
        run: cargo test --doc --features lua,tls

      - name: Upload the test archive
        uses: actions/upload-artifact@v4
        with:
          name: nextest-archive
          path: nextest-archive.tar.zst
          retention-days: 1
          # Already compressed.
          compression-level: 0

  test:
    needs: build-tests
    # A manual run skips detect-changes, and GitHub skips a job whose
    # upstream was skipped unless it says otherwise. When no source
    # changed, build-tests is skipped too, so this is false then.
    if: ${{ !cancelled() && needs.build-tests.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: test (${{ matrix.shard }}/6)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      # The tests read tests/fixtures, and the archive's binaries were built
      # at this path: check out where the build did.
      - uses: actions/checkout@v4

      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: nextest@0.9.150

      - uses: actions/download-artifact@v4
        with:
          name: nextest-archive

      - name: Run shard ${{ matrix.shard }} of 6
        run: >-
          cargo-nextest nextest run --profile ci
          --archive-file nextest-archive.tar.zst
          --extract-to "$GITHUB_WORKSPACE" --extract-overwrite
          --workspace-remap "$GITHUB_WORKSPACE"
          --partition hash:${{ matrix.shard }}/6

  # Mixed-version tests need the 1.2.2 release binary, pinned by digest.
  mixed-version:
    needs: build-tests
    # A manual run skips detect-changes, and GitHub skips a job whose
    # upstream was skipped unless it says otherwise. When no source
    # changed, build-tests is skipped too, so this is false then.
    if: ${{ !cancelled() && needs.build-tests.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: nextest@0.9.150

      - uses: actions/download-artifact@v4
        with:
          name: nextest-archive

      - name: Test against KiviDB 1.2.2
        run: |
          if [ "$(uname -m)" != x86_64 ]; then
            echo "Only the x86_64 Linux 1.2.2 binary is pinned, not $(uname -m)" >&2
            exit 1
          fi
          dir="$RUNNER_TEMP/kividb-1.2.2"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/kividb.tar.gz" \
            https://github.com/kividbio/kividb/releases/download/v1.2.2/kividb-linux-x86_64.tar.gz
          echo "3af9821b71801006835b7fc208a16a890fb0c8fa709ffabf2ad115641da9c51d  $dir/kividb.tar.gz" \
            | sha256sum -c -
          tar -xzf "$dir/kividb.tar.gz" -C "$dir"
          set -o pipefail
          # Fail if any 1.2 test was skipped, not only if one failed: every
          # test that needs the binary, in each file the filter covers, and
          # no other. The cluster ones are named after 1.2 (`_1_2_`).
          expected=$(cat tests/vset_persistence.rs tests/cluster.rs \
            | grep -c '^#\[ignore = "needs a 1.2 binary')
          named=$(grep -A1 '^#\[ignore = "needs a 1.2 binary' tests/cluster.rs \
            | grep -c '^fn [a-z0-9_]*_1_2_')
          in_cluster=$(grep -c '^#\[ignore = "needs a 1.2 binary' tests/cluster.rs)
          if [ "$named" != "$in_cluster" ]; then
            echo "a 1.2 test in tests/cluster.rs is not named with _1_2_" >&2
            exit 1
          fi
          KIVIDB_1_2_BIN="$dir/kividb/kividb" \
            cargo-nextest nextest run --profile ci --color never \
              --archive-file nextest-archive.tar.zst \
              --extract-to "$GITHUB_WORKSPACE" --extract-overwrite \
              --workspace-remap "$GITHUB_WORKSPACE" \
              --run-ignored ignored-only \
              -E 'binary(=vset_persistence) | (binary(=cluster) & test(/_1_2_/))' -j 1 \
            2>&1 | tee "$dir/test.log"
          grep -q "$expected tests run: $expected passed" "$dir/test.log"

  build-release:
    needs: detect-changes
    if: >-
      always() && needs.detect-changes.result != 'failure' &&
      (github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.run_ci == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --features lua,tls

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: kividb-binary
          path: target/release/kividb
          retention-days: 1

  # The check the branch ruleset requires under the name `rust`: it passes
  # only if everything above did. Skipped, like them, when no source changed.
  rust:
    needs: [detect-changes, lint, build-tests, test, mixed-version, build-release]
    # Also when detect-changes itself failed: the jobs above were skipped, and
    # a skipped check would count as passed. It runs, and fails below.
    if: >-
      always() && (github.event_name == 'workflow_dispatch' ||
      needs.detect-changes.result == 'failure' ||
      needs.detect-changes.outputs.run_ci == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gate
        env:
          RESULTS: >-
            detect-changes=${{ needs.detect-changes.result == 'failure' && 'failure' || 'success' }}
            lint=${{ needs.lint.result }}
            build-tests=${{ needs.build-tests.result }}
            test=${{ needs.test.result }}
            mixed-version=${{ needs.mixed-version.result }}
            build-release=${{ needs.build-release.result }}
        run: |
          echo "$RESULTS" | tr ' ' '\n'
          for r in $RESULTS; do
            [ "${r#*=}" = success ] || { echo "::error::${r%%=*} did not succeed (${r#*=})"; exit 1; }
          done

  e2e:
    runs-on: ubuntu-latest
    # Needs the binary only, so it starts as soon as that is built and runs
    # beside the tests instead of after them. `rust` still fails the PR if
    # the tests do.
    needs: build-release
    # A manual run skips detect-changes, and GitHub skips a job whose
    # upstream was skipped unless it says otherwise. When no source
    # changed, build-release is skipped too, so this is false then.
    if: ${{ !cancelled() && needs.build-release.result == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: Download KiviDB binary
        uses: actions/download-artifact@v4
        with:
          name: kividb-binary
          path: ./bin

      - name: Make binary executable
        run: chmod +x ./bin/kividb

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        timeout-minutes: 10
        run: pip install --timeout 30 --retries 5 -r tests/e2e/requirements.txt

      - name: Start KiviDB
        run: |
          nohup ./bin/kividb --port 6380 --loglevel error --io-model tokio \
            > /tmp/kividb-e2e.log 2>&1 &
          echo $! > /tmp/kividb-e2e.pid
          disown
          for i in $(seq 1 30); do
            nc -z 127.0.0.1 6380 2>/dev/null && echo "KiviDB is up." && break
            sleep 0.5
          done

      # The whole suite. Two MULTI/EXEC isolation tests used to be deselected
      # here; transactions are isolated now (docs/EXEC_ATOMICITY.md).
      - name: Run e2e tests
        run: |
          cd tests/e2e
          KIVI_EXTERNAL=1 KIVI_PORT=6380 KIVI_BINARY=/home/runner/work/kividb/kividb/bin/kividb \
            pytest modules/ -v

      - name: Stop KiviDB
        if: always()
        run: kill $(cat /tmp/kividb-e2e.pid) 2>/dev/null || true

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kividb-e2e-logs-${{ github.run_id }}
          path: /tmp/kividb-e2e.log

  redis-compat:
    runs-on: ubuntu-latest
    # Needs the binary only, so it starts as soon as that is built and runs
    # beside the tests instead of after them. `rust` still fails the PR if
    # the tests do.
    needs: build-release
    # A manual run skips detect-changes, and GitHub skips a job whose
    # upstream was skipped unless it says otherwise. When no source
    # changed, build-release is skipped too, so this is false then.
    if: ${{ !cancelled() && needs.build-release.result == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: Test the gate
        run: bash scripts/redis_compat_check_test.sh

      - name: Install Tcl
        timeout-minutes: 10
        run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y tcl tcllib

      # The release KiviDB reports itself as (`redis_version` in INFO): an
      # older suite fails it for what that release added, such as the
      # fields Redis 8.6 put in XINFO STREAM FULL.
      - name: Clone Redis test suite
        run: |
          git clone --depth 1 --branch 8.10.2 \
            https://github.com/redis/redis.git /tmp/redis-tests

      - name: Download KiviDB binary
        uses: actions/download-artifact@v4
        with:
          name: kividb-binary
          path: .

      # One unit of the suite at a time, each against a server of its own:
      # see scripts/redis_compat.sh for why. The table it makes is on the
      # run's summary page; the logs are the artifact below.
      - name: Run Redis compatibility tests
        timeout-minutes: 60
        run: |
          chmod +x ./kividb
          bash scripts/redis_compat.sh ./kividb /tmp/redis-tests /tmp/redis-compat

      - name: Upload compat logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redis-compat-log-${{ github.run_id }}
          path: /tmp/redis-compat
          retention-days: 14
