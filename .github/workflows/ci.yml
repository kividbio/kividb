name: CI

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci.yml'
  # By hand, from the Actions tab: the full build and test of a branch, e.g.
  # master before a release tag. Skips the change detection below.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Cheap gate: only build/test if real source changed ───────────────────
  # The `paths:` filter above includes this workflow file itself, so that
  # editing ci.yml still gets a real check -- but without this job, every
  # such edit also re-runs the full build+test+e2e+redis-compat cycle.
  detect-changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # dorny/paths-filter fetches the PR's changed-files list from the
    # GitHub API on pull_request events, which needs pull-requests: read --
    # the repo's default GITHUB_TOKEN permissions don't include it, and
    # this job is the only one in this workflow that needs it, so it's
    # scoped here rather than granted workflow-wide.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_ci: ${{ steps.filter.outputs.source }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Deliberately diffing against the *previous push* on this PR
          # (github.event.before, set on `synchronize` events), not the
          # PR's merge-base -- paths-filter's default is "has this whole
          # PR touched source", which stays true for every push once any
          # commit in the PR has, even a later workflow-only push. This
          # instead answers "did *this* push touch source". Falls back to
          # empty (paths-filter's own default: diff against the merge
          # base) for `opened`/`reopened`, where there's no meaningful
          # previous push to diff against anyway.
          base: ${{ github.event.action == 'synchronize' && github.event.before || '' }}
          filters: |
            source:
              - 'src/**'
              - 'tests/**'
              - 'Cargo.toml'
              - 'Cargo.lock'

  rust:
    needs: detect-changes
    # always(): on a manual run detect-changes is skipped, which would
    # otherwise skip this job too.
    if: >-
      always() && needs.detect-changes.result != 'failure' &&
      (github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.run_ci == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --features lua,tls

      - name: Build
        run: cargo build --release --features lua,tls

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: kividb-binary
          path: target/release/kividb
          retention-days: 1

  e2e:
    runs-on: ubuntu-latest
    needs: rust
    # As `rust`: on a manual run detect-changes is skipped, and a job that
    # needs a job that needs it is skipped too unless it says otherwise.
    if: always() && needs.rust.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Download KiviDB binary
        uses: actions/download-artifact@v4
        with:
          name: kividb-binary
          path: ./bin

      - name: Make binary executable
        run: chmod +x ./bin/kividb

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r tests/e2e/requirements.txt

      - name: Start KiviDB
        run: |
          nohup ./bin/kividb --port 6380 --loglevel error --io-model tokio \
            > /tmp/kividb-e2e.log 2>&1 &
          echo $! > /tmp/kividb-e2e.pid
          disown
          for i in $(seq 1 30); do
            nc -z 127.0.0.1 6380 2>/dev/null && echo "KiviDB is up." && break
            sleep 0.5
          done

      # The whole suite. Two MULTI/EXEC isolation tests used to be deselected
      # here; transactions are isolated now (docs/EXEC_ATOMICITY.md).
      - name: Run e2e tests
        run: |
          cd tests/e2e
          KIVI_EXTERNAL=1 KIVI_PORT=6380 KIVI_BINARY=/home/runner/work/kividb/kividb/bin/kividb \
            pytest modules/ -v

      - name: Stop KiviDB
        if: always()
        run: kill $(cat /tmp/kividb-e2e.pid) 2>/dev/null || true

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kividb-e2e-logs-${{ github.run_id }}
          path: /tmp/kividb-e2e.log

  redis-compat:
    runs-on: ubuntu-latest
    needs: rust
    # As `rust`: on a manual run detect-changes is skipped, and a job that
    # needs a job that needs it is skipped too unless it says otherwise.
    if: always() && needs.rust.result == 'success'
    # Never marks the PR as failed — it's a signal, not a gate
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Tcl
        run: sudo apt-get install -y tcl tcllib

      # The release KiviDB reports itself as (`redis_version` in INFO): an
      # older suite fails it for what that release added, such as the
      # fields Redis 8.6 put in XINFO STREAM FULL.
      - name: Clone Redis test suite
        run: |
          git clone --depth 1 --branch 8.10.2 \
            https://github.com/redis/redis.git /tmp/redis-tests

      - name: Download KiviDB binary
        uses: actions/download-artifact@v4
        with:
          name: kividb-binary
          path: .

      # One unit of the suite at a time, each against a server of its own:
      # see scripts/redis_compat.sh for why. The table it makes is on the
      # run's summary page; the logs are the artifact below.
      - name: Run Redis compatibility tests
        timeout-minutes: 60
        run: |
          chmod +x ./kividb
          bash scripts/redis_compat.sh ./kividb /tmp/redis-tests /tmp/redis-compat

      - name: Upload compat logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redis-compat-log-${{ github.run_id }}
          path: /tmp/redis-compat
          retention-days: 14
