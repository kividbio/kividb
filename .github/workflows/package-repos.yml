name: Package repositories

# Adds a stable release's .deb and .rpm packages to the apt and dnf
# repositories at https://packages.kividb.io and signs them. The site is the
# GitHub Pages site of kividbio/packages; packaging/repos/build-repos.sh builds
# it, and docs/INSTALL.md says how it is used and how it is set up.
#
# release.yml calls this once the GitHub Release is published, so the packages
# come from the release itself and have their attestations. It can also be
# run by hand for a release that is already out: with dry_run (the default
# then) it builds the repositories into an artifact and publishes nothing,
# signing with a throwaway key if the real one is not set up yet.
#
# The job runs in the `packages` environment, which holds the secrets and is
# limited to master and v* tags (docs/INSTALL.md, "Maintainers: one-time
# setup"). The job is skipped, with a notice, while a secret it needs is
# missing, so a release never fails for want of them:
#   PACKAGES_GPG_PRIVATE_KEY  the signing key, ASCII-armored
#   PACKAGES_GPG_PASSPHRASE   its passphrase, if it has one
#   PACKAGES_DEPLOY_KEY       an SSH deploy key with write access to
#                             kividbio/packages, and to nothing else
# Variable: PACKAGES_GPG_FINGERPRINT, the fingerprint the imported key must
# have. Required whenever the real key is used.

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      dry_run:
        type: boolean
        default: false
    # Only these, not `secrets: inherit`. A secret set in the `packages`
    # environment takes the place of the one passed here.
    secrets:
      PACKAGES_GPG_PRIVATE_KEY:
        required: false
      PACKAGES_GPG_PASSPHRASE:
        required: false
      PACKAGES_DEPLOY_KEY:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: "A released tag whose packages to add (e.g. v1.2.1)"
        required: true
      dry_run:
        description: "Build the repositories into an artifact only; publish nothing"
        type: boolean
        default: true

permissions:
  contents: read
  attestations: read

# Two releases in a row must not both rewrite the site at once. A dry run
# publishes nothing, so it neither waits for a publish nor holds one up.
concurrency:
  group: package-repos-${{ inputs.dry_run && 'dry-run' || 'publish' }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag }}
  DRY_RUN: ${{ inputs.dry_run }}
  SITE_REPO: kividbio/packages
  BASE_URL: https://packages.kividb.io
  # Versions kept per package and architecture. A release adds about 56 MB:
  # `kividb` (four packages of about 6.6 MB) and, from 1.3.0, `kividb-full`
  # (four of about 7.4 MB). 12 keep the site near 670 MB, under the job's
  # 900 MB limit (build-repos.sh) with room for the packages to grow, inside
  # GitHub Pages' 1 GB.
  KEEP: "12"

jobs:
  repos:
    runs-on: ubuntu-24.04
    environment: packages
    steps:
      - name: Check the tag and the secrets
        id: cfg
        env:
          HAVE_GPG: ${{ secrets.PACKAGES_GPG_PRIVATE_KEY != '' }}
          HAVE_DEPLOY: ${{ secrets.PACKAGES_DEPLOY_KEY != '' }}
        run: |
          set -euo pipefail
          out() { echo "$1" >> "$GITHUB_OUTPUT"; }
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::'$TAG' is not a release tag (vX.Y.Z)"; exit 1 ;;
          esac
          case "$TAG" in
            *-*)
              echo "::notice::$TAG is not a stable release; only stable releases are added to the package repositories."
              out "run=false"
              exit 0
              ;;
          esac
          if [ "$DRY_RUN" = "true" ]; then
            out "run=true"
            out "publish=false"
            if [ "$HAVE_GPG" = "true" ]; then
              out "throwaway=false"
            else
              echo "::notice::PACKAGES_GPG_PRIVATE_KEY is not set: this dry run signs with a throwaway key."
              out "throwaway=true"
            fi
            exit 0
          fi
          if [ "$HAVE_GPG" != "true" ] || [ "$HAVE_DEPLOY" != "true" ]; then
            echo "::notice::Package repositories skipped: set the PACKAGES_GPG_PRIVATE_KEY and PACKAGES_DEPLOY_KEY secrets to publish them (docs/INSTALL.md, 'Maintainers: one-time setup')."
            out "run=false"
            exit 0
          fi
          out "run=true"
          out "publish=true"
          out "throwaway=false"

      # The build script and docs come from this workflow's own commit, not
      # the tag: a dry run for an older release runs before the tag had them.
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.run == 'true'
        with:
          path: kividb
          persist-credentials: false

      - name: Install the repository tools
        if: steps.cfg.outputs.run == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends apt-utils createrepo-c rpm gnupg
          createrepo_c --version
          rpmsign --version

      - name: Import the signing key
        if: steps.cfg.outputs.run == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.PACKAGES_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.PACKAGES_GPG_PASSPHRASE }}
          WANT_FPR: ${{ vars.PACKAGES_GPG_FINGERPRINT }}
          THROWAWAY: ${{ steps.cfg.outputs.throwaway }}
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          if [ "$THROWAWAY" = "true" ]; then
            gpg --batch --passphrase '' --quick-gen-key \
              "KiviDB Packages DRY RUN <packages@kividb.io>" rsa4096 sign 1d
          else
            if [ -z "$WANT_FPR" ]; then
              echo "::error::set the PACKAGES_GPG_FINGERPRINT variable to the signing key's fingerprint (docs/INSTALL.md, 'Maintainers: one-time setup')"
              exit 1
            fi
            printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
            if [ -n "$GPG_PASSPHRASE" ]; then
              # Unlock it once in the agent, so gpg and rpmsign sign with no
              # prompt. The passphrase goes in on stdin (printf is a shell
              # builtin), never on a command line, where other processes on
              # the runner could read it.
              echo allow-preset-passphrase >> "$GNUPGHOME/gpg-agent.conf"
              gpgconf --kill gpg-agent
              gpg-connect-agent /bye
              for grip in $(gpg --batch --with-colons --with-keygrip --list-secret-keys | awk -F: '$1 == "grp" { print $10 }'); do
                printf '%s' "$GPG_PASSPHRASE" | /usr/lib/gnupg/gpg-preset-passphrase --preset "$grip"
              done
            fi
          fi
          fpr="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')"
          if [ "$THROWAWAY" != "true" ] && [ "$fpr" != "${WANT_FPR// /}" ]; then
            echo "::error::the signing key is $fpr, not PACKAGES_GPG_FINGERPRINT ($WANT_FPR)"
            exit 1
          fi
          echo "GPG_KEY=$fpr" >> "$GITHUB_ENV"
          echo "signing key: $fpr"

      - name: Download the release's packages
        if: steps.cfg.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir incoming
          # kividb and, from 1.3.0, kividb-full (#732); a release before
          # that has no kividb-full packages, and gh does not mind.
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D incoming \
            -p 'kividb_*.deb' -p 'kividb.*.rpm' \
            -p 'kividb-full_*.deb' -p 'kividb-full.*.rpm' -p SHA256SUMS.txt
          cd incoming
          grep -E ' (\./)?(kividb(-full)?_[a-z0-9]+\.deb|kividb(-full)?\.[a-z0-9_]+\.rpm)$' SHA256SUMS.txt | sha256sum -c -
          rm SHA256SUMS.txt
          # Built by this repository's release workflow, from the tag.
          for f in *.deb *.rpm; do
            gh attestation verify "$f" -R "$GITHUB_REPOSITORY" >/dev/null
            echo "attested: $f"
          done
          ls -l

      # Published: the site's own repository, to push to. A dry run starts
      # from what is published now, read-only, or from nothing.
      - name: Check out the site
        if: steps.cfg.outputs.publish == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SITE_REPO }}
          ssh-key: ${{ secrets.PACKAGES_DEPLOY_KEY }}
          ref: main
          path: site
      - name: Fetch the published site (dry run)
        if: steps.cfg.outputs.run == 'true' && steps.cfg.outputs.publish != 'true'
        run: |
          git clone --depth 1 "https://github.com/${SITE_REPO}.git" site 2>/dev/null \
            || { echo "no published site yet: starting from nothing"; mkdir site; }

      # A package must say it needs glibc 2.34 (docs/INSTALL.md promises it;
      # packages before 1.2.1 do not), or the job stops. A dry run only warns,
      # so it can be tried with a release from before then.
      - name: Add the packages and sign the repositories
        if: steps.cfg.outputs.run == 'true'
        env:
          GLIBC_DEP_CHECK: ${{ steps.cfg.outputs.publish == 'true' && 'fail' || 'warn' }}
        run: bash kividb/packaging/repos/build-repos.sh site incoming

      # The site is one commit, replaced each time: every package version ever
      # added would otherwise stay in the git history, which GitHub Pages
      # serves from and which counts against the repository's size.
      - name: Publish
        if: steps.cfg.outputs.publish == 'true'
        run: |
          set -euo pipefail
          cd site
          git checkout -q --orphan site
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "KiviDB ${TAG#v} packages (from ${GITHUB_REPOSITORY}@${GITHUB_SHA::12})"
          git push --force origin HEAD:main
          echo "Published. GitHub Pages serves it at ${BASE_URL} within a few minutes."

      - name: Check that the site serves the new version
        if: steps.cfg.outputs.publish == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          for _ in $(seq 1 30); do
            if curl -fsS "${BASE_URL}/deb/dists/stable/main/binary-amd64/Packages" | grep -qx "Version: ${ver}"; then
              echo "${BASE_URL} serves kividb ${ver}"
              exit 0
            fi
            sleep 20
          done
          echo "::warning::${BASE_URL} does not list kividb ${ver} after 10 minutes; check the Pages deployment of ${SITE_REPO}."
          exit 1

      - name: Upload the built repositories (dry run)
        if: steps.cfg.outputs.run == 'true' && steps.cfg.outputs.publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: package-repos-${{ inputs.tag }}
          path: |
            site
            !site/.git
          include-hidden-files: true
          retention-days: 7
