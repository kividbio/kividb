name: Compatibility
# Runs the framework harnesses in benchmarks/*-compat that have a ci.sh against KiviDB and against
# Redis, and fails when a check passes on Redis and fails on KiviDB, when KiviDB stops passing a
# check its harness lists as passing, or when a harness could not run (#33). The contract a harness
# follows to take part, and how to add one, are in benchmarks/README.md.
#
# Actions minutes cost money, so: never on push or pull_request; one runner, the harnesses one after
# another; a time limit on the job and on each harness. Both servers come from pinned images: Redis
# by digest, KiviDB at the release tag (a release, or the image given to a run by hand: the latest
# release by default). No schedule: with every input pinned, a run repeats the last one; a run by
# hand with a pre-release image covers what is new. No secrets: nothing here needs a model API key.

on:
  release:
    types: [published] # release.yml publishes the release after its images are pushed
  workflow_dispatch:
    inputs:
      image:
        description: "KiviDB image to test (default: docker.io/kividb/kividb at the latest release)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  compat:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      REDIS_IMAGE: redis:8.10.3@sha256:1f88291b4c57bdf249f02eb085a8669889b2d2954e91d4de5118a5da6b78dd53
      OUT: ${{ github.workspace }}/compat-results
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true # later runs skip most of the installs
          cache-dependency-glob: benchmarks/*-compat/requirements.txt

      - name: Pick and pull the servers
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_IMAGE: ${{ inputs.image }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          image=$INPUT_IMAGE
          if [ -z "$image" ]; then
            tag=${RELEASE_TAG:-$(gh api repos/kividbio/kividb/releases/latest --jq .tag_name)}
            image=docker.io/kividb/kividb:$tag
          fi
          echo "KIVIDB_IMAGE=$image" >> "$GITHUB_ENV"
          echo "WORK=$RUNNER_TEMP/compat-work" >> "$GITHUB_ENV"
          docker pull -q "$image"
          # The harnesses that need scripting (a `kividb-variant` file saying `lua`) run the lua variant of the image.
          case $image in *-lua | *-full) ;; *) docker pull -q "$image-lua" ;; esac
          docker pull -q "$REDIS_IMAGE"
          printf 'KiviDB `%s` against Redis `%s`\n\n' "$image" "$REDIS_IMAGE" >> "$GITHUB_STEP_SUMMARY"

      # One step per harness, each with its own limit. `!cancelled()` runs every harness even when an
      # earlier one found a regression; any failed step fails the job.
      - name: semantic-kernel
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: benchmarks/ci/run-harness.sh semantic-kernel

      - name: haystack-valkey
        if: ${{ !cancelled() }}
        timeout-minutes: 6
        run: benchmarks/ci/run-harness.sh haystack-valkey

      - name: gptcache
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: benchmarks/ci/run-harness.sh gptcache

      - name: langchain
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: benchmarks/ci/run-harness.sh langchain

      - name: langgraph
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: benchmarks/ci/run-harness.sh langgraph

      - name: llamaindex
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: benchmarks/ci/run-harness.sh llamaindex

      - name: mem0
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: benchmarks/ci/run-harness.sh mem0

      # The workloads KiviDB's published claims are about (#849): each runs the application's own
      # tests, or its own scripts and commands, against both servers. The first four are Ruby, in a
      # pinned image (they hardcode localhost:6379, so they need the server on that port).
      - name: stoplight
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: benchmarks/ci/run-harness.sh stoplight

      - name: sidekiq-unique-jobs
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: benchmarks/ci/run-harness.sh sidekiq-unique-jobs

      - name: sidekiq-scheduler
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: benchmarks/ci/run-harness.sh sidekiq-scheduler

      - name: sidekiq-mastodon
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: benchmarks/ci/run-harness.sh sidekiq-mastodon

      - name: sentry-spans
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: benchmarks/ci/run-harness.sh sentry-spans

      - name: client-tracking
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: benchmarks/ci/run-harness.sh client-tracking

      - name: ratelimit-scripts
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: benchmarks/ci/run-harness.sh ratelimit-scripts

      - name: Keep the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: compat-results
          path: compat-results/
          retention-days: 14
