name: Vector Benchmark

# Regression + competitive gate for vector search performance, using the
# real methodology behind the published kividb-vs-Redis comparison:
# the official redis/vector-db-benchmark (see below for why upstream, not our
# fork), glove-25-angular (1.18M vectors), HNSW M=16/EF_CONSTRUCTION=256.
#
# Datasets (the `datasets` input picks any subset; all three by default):
#
#   glove-25-angular -- unfiltered, low-dimension (25), 1.18M vectors. The
#     original gate, unchanged: same tool pin (VDB_BENCHMARK_REF), HNSW
#     M=16/EF_CONSTRUCTION=256, ef 64/128/256/512 at parallel=100, same gates
#     and baseline (the top-level blocks of benchmarks/vector-baseline.json).
#   h-and-m-2048-angular-filters -- FILTERED search: 105,542 2048-dim
#     fashion embeddings with TAG/NUMERIC metadata, every query a KNN under a
#     metadata filter (median 2% of documents match). This is the workload
#     where a filter-path regression shows; glove alone never exercises it.
#   dbpedia-openai-100K-1536-angular -- unfiltered, HIGH-dimension (1536),
#     100K OpenAI embeddings: distance-kernel and HNSW cost per vector, which
#     glove's 25 dimensions hide.
#
# The two added datasets reproduce the manual kividb-vs-Redis 8.10 runs:
# HNSW M=16/EF_CONSTRUCTION=128, upload 16 threads/batch 64, ef 64/128/256 at
# 1 client plus ef 128 at 16 and 100 clients. They need a newer tool pin
# (VDB_BENCHMARK_REF_EXTRA): at VDB_BENCHMARK_REF the tool's kividb engine
# ran metadata filters wrongly (upstream #237, "recall 0.000 -> 1.000") and
# did not escape TAG values (#375). glove stays on its own pin so its numbers
# remain comparable with its baseline; the tool also changed what its
# precision metric means in between (#249). Each added dataset has its own
# section in the baseline file and its own gates; see "Compare against
# baseline".
#
# Engines: kividb and Redis 8.10.2 are compared and gated. Dragonfly
# (DRAGONFLY_VERSION, native arm64 binary, one proactor thread per core) runs
# on every dataset too, after them and on the same terms -- one engine
# resident at a time, the same tool settings -- but is REPORT-ONLY: its
# numbers go into the summary table next to the other two, ingest time first,
# and no gate is ever computed on it; a failed Dragonfly run is a warning, not
# a failed job. Dragonfly's FT.SEARCH serves the filtered dataset's TAG/NUMERIC
# prefilters (checked on a dry run: recall 0.998, like the others).
#
# Server + client, one virtual network, like the main benchmark: kividb and
# Redis run on a dedicated SERVER instance; vector-db-benchmark
# (the driver) runs on a SEPARATE CLIENT instance -- the same topology
# github.com/kividbio/kivi-benchmark's memtier runbook uses, and for the same
# reason: co-locating the server and a 100-thread client on one small,
# burstable box (this workflow's original design) starves the server of CPU
# under its own load, confounding the numbers with contention that has
# nothing to do with kividb's real performance. A dedicated, non-burstable
# server also avoids a burstable instance's CPU-credit exhaustion silently
# throttling a long ingest run partway through -- both confounds were caught
# live on a shared t4g.xlarge before this topology change.
#
# Why upstream, not our fork: redis-performance/vector-db-benchmark (now
# redis/vector-db-benchmark) rewrote the tool in Rust and moved the old Python
# tool this workflow originally used to a v0/ subtree. It didn't have a
# "kividb" engine either, until we added one and it merged upstream as
# PR redis/vector-db-benchmark#203 (2026-07-26) -- fixing a real bug the old
# Python setup hit: generic wait-for-indexing polls RediSearch's `num_docs`,
# which kividb's FT.INFO never sets, so it stalled every run until its own
# timeout even though the index was already fully built. We initially kept
# running from our own fork because of a second, separate bug (kividb missing
# from experiment.rs's engine allowlist, caught live) that PR #203 hadn't
# covered -- confirmed fixed upstream too as of the pinned commit below, so
# this now runs straight from the official repo. Bump VDB_BENCHMARK_REF
# deliberately when re-validating against a newer upstream commit, rather
# than tracking `master` and letting the pin drift silently.
#
# arm64, not x86: matches kividb-benchmark's own memtier runbook, and
# lets `benchmark` build on a native GitHub-hosted ubuntu-*-arm runner (GA'd
# 2026-01) instead of cross-compiling -- see that job below. The machines
# are Azure Dpsv5 (arm64), the same as the memtier benchmark's.
#
# Both engines run natively (no Docker) on the SERVER -- kividb as a built
# binary (both it and vector-db-benchmark are Rust, both built on the same
# arm64 runner as `launch` provisions -- no cross-compiling, no Rust
# toolchain needed on either ephemeral instance), Redis from the
# same packages.redis.io apt repo benchmark.yml already uses for plain Redis
# -- on different ports on the SERVER, strictly one resident at a time: each
# engine is started, benchmarked, and stopped before the next one starts, and
# each start asserts the other is absent. (This comment claimed "one at a
# time" while the workflow actually started both up front and left them both
# running for both phases -- see the ordering comment on the start steps for
# why that biased the comparison, and in which direction.) Redis is
# pinned to 8.10.2 with its built-in query engine -- the version the README's
# vector comparison uses (it replaced redis-stack-server 7.4.0-v8 on
# 2026-10-16); do not float on whatever the apt repo's latest happens to be
# on a given day.
#
# No Python anywhere in this workflow (the old Python v0/ setup needed a
# venv, a `redis==4.6.0` pin to dodge a RESP3 incompatibility, etc. -- all
# gone with the Rust tool, which defaults to RESP2 like kividb) except
# compare_vector_baseline.py, which only runs on the GitHub-hosted runner.
#
# Real run times: on the shared-instance topology this replaced, kividb
# ingest took ~27 min on a throttled/thread-starved t4g.xlarge (735 rec/s
# average, degrading over the run -- see the topology comment above) vs.
# ~7 min (2,899 rec/s) on an unconstrained machine. Expect the dedicated
# server to land close to the latter; budget accordingly -- see
# timeout-minutes -- and recalibrate via update_baseline once a real run
# lands on this topology instead of trusting the pre-existing numbers in
# benchmarks/vector-baseline.json, which predate this topology entirely.
#
# The two added datasets are small (105K and 100K vectors; 1.4 GB and 0.75 GB
# on the client's 64 GB disk once extracted; under 2.5 GB peak RSS for any
# engine on the server's 128 GB). On a dry run of this workflow's commands
# (D32ps_v5 server, KiviDB 1.2.0-rc3), all three engines took ~33 min on
# h-and-m -- Redis's 1-client filtered queries alone ~13 min, its query set at
# ~128 q/s, three repetitions -- ~7 min on dbpedia and ~3 min on glove; ~45
# min in all, plus ~10 min to build the second tool pin on a cold cache.

on:
  # Manual only, from master (the Azure sign-in trusts master runs only; pick
  # the branch with `ref`). This provisions two real Azure machines
  # and ingests 1.18M vectors, so it costs real money and tens of minutes per
  # run -- too much to fire automatically on every merge that happens to touch
  # a vector file. It is a deliberate regression/competitive gate: run it when
  # re-validating vector performance or before a release, not on every push.
  #
  # It was never on `pull_request` either, for the same reason plus the churn
  # of pushes that only edit this workflow file while iterating on it.
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/tag/SHA to benchmark (leave empty for current)"
        required: false
        default: ""
      server_size:
        description: "Azure size for kividb/Redis (arm64)"
        required: false
        default: "Standard_D32ps_v5"
      client_size:
        description: "Azure size for the vector-db-benchmark driver (arm64)"
        required: false
        default: "Standard_D32ps_v5"
      location:
        description: "Azure region for both machines (the arm64 quota is in centralindia)"
        required: false
        default: "centralindia"
      datasets:
        description: "Datasets to run, space-separated: any of glove-25-angular h-and-m-2048-angular-filters dbpedia-openai-100K-1536-angular"
        required: false
        default: "glove-25-angular h-and-m-2048-angular-filters dbpedia-openai-100K-1536-angular"
      update_baseline:
        description: "After a run (regressed or not), overwrite benchmarks/vector-baseline.json with these results and commit. Only use after deliberately reviewing why numbers changed."
        type: boolean
        required: false
        default: false

# Shared group name with .github/workflows/benchmark.yml ("Benchmark",
# the memtier/general benchmark -- also an Azure pair in the same
# region): a run of either workflow queues behind a run of the
# other, rather than both racing for the same subscription's vCPU
# quota simultaneously. cancel-in-progress: false to match benchmark.yml --
# queue, don't cancel a run that's already paying for real machine time.
concurrency:
  group: benchmark-global
  cancel-in-progress: false

env:
  SSH_KEY_PATH: /tmp/kividb_vector_bench_ssh_key
  RUN_TAG: vecbench-${{ github.run_id }}
  # The official upstream repo -- see the top-of-file comment for the fork
  # history. Pinned to today's HEAD of `master` (verified to include both the
  # kividb engine from PR #203 and the experiment.rs allowlist fix), not a
  # floating branch ref -- bump deliberately when re-validating against a
  # newer commit, don't let this drift silently.
  VDB_BENCHMARK_REPO: "redis/vector-db-benchmark"
  VDB_BENCHMARK_REF: "31a28b5ae6d35da96de6d218ada209868a628b42"
  DATASET: "glove-25-angular"
  # The filtered and high-dimension datasets run on a newer pin of the same
  # upstream repo (tag 0.2.0) -- see the top-of-file comment for why glove
  # does not share it. Bump deliberately, like VDB_BENCHMARK_REF.
  VDB_BENCHMARK_REF_EXTRA: "d22d44e8b46009a800a59e952710166ece2e38a1"
  EXTRA_DATASETS_ALLOWED: "h-and-m-2048-angular-filters dbpedia-openai-100K-1536-angular"
  # Exact packages.redis.io arm64 build of Redis 8.10.2, whose query engine
  # (vector search included) ships with Redis itself -- see the top-of-file
  # comment.
  REDIS_DEB: "6:8.10.2-1rl1~jammy1"
  # Dragonfly, the third engine: REPORT-ONLY (no gate is ever computed on
  # it). The native arm64 release binary at the version benchmark.yml pins,
  # with one proactor thread per core, as the warefeats comparison runs it.
  DRAGONFLY_VERSION: "v2.0.2"

permissions:
  contents: read

jobs:
  # ── Launch server + client (Azure, infra/benchmark-azure) ─────────────────
  launch:
    uses: ./.github/workflows/_benchmark-create.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write
    with:
      location: ${{ inputs.location }}
      server_size: ${{ inputs.server_size }}
      client_size: ${{ inputs.client_size }}
      # Bare Ubuntu: this workflow ships its own binaries over SSH, and a
      # startup script running apt would fight its apt-get for the lock.
      bootstrap: false
      # Same datacenter, not just the same region.
      use_proximity_group: true

  # ── Build kividb + vector-db-benchmark, provision both instances, run, compare ─
  benchmark:
    needs: launch
    # arm64, native (GA'd 2026-01 for private repos) -- matches the arm64
    # Azure machines `launch` provisions, so `cargo build --release`
    # below produces binaries that run unmodified on them, no cross-compile
    # toolchain needed on either instance.
    runs-on: ubuntu-22.04-arm
    # Build/provision overhead (~15-20 min) + up to 40 min poll budget per
    # engine (see the two "Run vector-db-benchmark against ..." steps) +
    # fetch/compare -- generous margin over the ~100 min worst case.
    # Dragonfly and the filtered/high-dimension datasets add ~10 min to build
    # the second tool pin (cold cache) and ~45 min of runs (measured on a dry
    # run; see the top-of-file comment). Each of those runs has a 40 min poll
    # budget, which a healthy run never nears.
    timeout-minutes: 180
    env:
      # Built as the arm64 release binaries and images are (release.yml,
      # Dockerfile): atomics as single LSE instructions. Without it the
      # benchmark measures a build nobody downloads.
      RUSTFLAGS: "-C target-feature=+lse"
      SERVER_HOST: ${{ needs.launch.outputs.server_public_ip }}
      SERVER_PRIVATE_IP: ${{ needs.launch.outputs.server_private_ip }}
      CLIENT_HOST: ${{ needs.launch.outputs.client_public_ip }}
    outputs:
      regression: ${{ steps.compare.outputs.regression }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # glove=true|false, and extra= the other selected datasets in a fixed
      # order. An empty input (a dispatch through the API that omits it)
      # means all three, like the default.
      - name: Resolve datasets
        id: datasets
        env:
          REQUESTED: ${{ inputs.datasets }}
        run: |
          set -euo pipefail
          REQUESTED="${REQUESTED//,/ }"
          if [[ -z "${REQUESTED// /}" ]]; then
            REQUESTED="$DATASET $EXTRA_DATASETS_ALLOWED"
          fi
          GLOVE=false
          EXTRA=""
          for ds in $REQUESTED; do
            if [[ "$ds" == "$DATASET" ]]; then
              GLOVE=true
            elif [[ " $EXTRA_DATASETS_ALLOWED " == *" $ds "* ]]; then
              [[ " $EXTRA " == *" $ds "* ]] || EXTRA="${EXTRA:+$EXTRA }$ds"
            else
              echo "::error::unknown dataset '$ds' (allowed: $DATASET $EXTRA_DATASETS_ALLOWED)" >&2
              exit 1
            fi
          done
          echo "glove=$GLOVE" >> "$GITHUB_OUTPUT"
          echo "extra=$EXTRA" >> "$GITHUB_OUTPUT"
          echo "glove=$GLOVE extra=$EXTRA"

      - name: Checkout vector-db-benchmark (kividbio fork, pinned -- see top-of-file comment)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.VDB_BENCHMARK_REPO }}
          ref: ${{ env.VDB_BENCHMARK_REF }}
          path: vector-db-benchmark

      - name: Checkout vector-db-benchmark for the filtered/high-dimension datasets (newer pin)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.VDB_BENCHMARK_REPO }}
          ref: ${{ env.VDB_BENCHMARK_REF_EXTRA }}
          path: vector-db-benchmark-extra

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            vector-db-benchmark
            vector-db-benchmark-extra

      - name: Install libhdf5-dev (vector-db-benchmark's HDF5 dataset reader needs it to build)
        # dpkg-dev is for dpkg-architecture, used below to locate HDF5's
        # multi-arch install path -- matches vector-db-benchmark's own Dockerfile.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libhdf5-dev pkg-config dpkg-dev

      - name: Build kividb (release, default features — matches how it's actually shipped)
        run: cargo build --release

      - name: Build vector-db-benchmark
        working-directory: vector-db-benchmark
        run: |
          # HDF5_DIR hints hdf5-sys at Debian/Ubuntu's multi-arch HDF5 layout
          # (matches this repo's own Dockerfile) -- without it, hdf5-sys can't
          # locate the HDF5 headers/lib even though libhdf5-dev is installed.
          HDF5_DIR="/usr/lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH)/hdf5/serial" \
            cargo build --release --bin vector-db-benchmark

      - name: Build vector-db-benchmark (newer pin, for the filtered/high-dimension datasets)
        if: steps.datasets.outputs.extra != ''
        working-directory: vector-db-benchmark-extra
        run: |
          HDF5_DIR="/usr/lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH)/hdf5/serial" \
            cargo build --release --bin vector-db-benchmark

      - name: Write SSH private key
        env:
          BENCHMARK_SSH_PRIVATE_KEY: ${{ secrets.BENCHMARK_SSH_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s\n' "$BENCHMARK_SSH_PRIVATE_KEY" > "$SSH_KEY_PATH"
          chmod 600 "$SSH_KEY_PATH"

      - name: Deploy kividb to server, vector-db-benchmark to client
        env:
          EXTRA: ${{ steps.datasets.outputs.extra }}
        run: |
          set -euo pipefail
          SERVER_SSH="ssh -i $SSH_KEY_PATH -o StrictHostKeyChecking=no -o ConnectTimeout=30 ubuntu@$SERVER_HOST"
          CLIENT_SSH="ssh -i $SSH_KEY_PATH -o StrictHostKeyChecking=no -o ConnectTimeout=30 ubuntu@$CLIENT_HOST"
          SERVER_SCP="scp -i $SSH_KEY_PATH -o StrictHostKeyChecking=no"
          CLIENT_SCP="scp -i $SSH_KEY_PATH -o StrictHostKeyChecking=no"

          $SERVER_SSH "mkdir -p /home/ubuntu/kividb"
          $SERVER_SCP target/release/kividb ubuntu@$SERVER_HOST:/home/ubuntu/kividb/kividb
          $SERVER_SSH "chmod +x /home/ubuntu/kividb/kividb"

          $CLIENT_SSH "mkdir -p /home/ubuntu/vdb/datasets"
          $CLIENT_SCP vector-db-benchmark/target/release/vector-db-benchmark \
            ubuntu@$CLIENT_HOST:/home/ubuntu/vdb/vector-db-benchmark
          $CLIENT_SSH "chmod +x /home/ubuntu/vdb/vector-db-benchmark"
          # datasets/datasets.json must exist relative to wherever the binary
          # runs (it walks up from CWD looking for it) -- the dataset itself
          # (glove-25-angular.hdf5) is downloaded straight into datasets/ by
          # the binary at runtime, no separate download step needed.
          $CLIENT_SCP vector-db-benchmark/datasets/datasets.json \
            ubuntu@$CLIENT_HOST:/home/ubuntu/vdb/datasets/datasets.json

          # The newer pin gets its own directory (its own datasets.json, its
          # own results/), so the two tools never read each other's files.
          if [[ -n "$EXTRA" ]]; then
            $CLIENT_SSH "mkdir -p /home/ubuntu/vdbx/datasets"
            $CLIENT_SCP vector-db-benchmark-extra/target/release/vector-db-benchmark \
              ubuntu@$CLIENT_HOST:/home/ubuntu/vdbx/vector-db-benchmark
            $CLIENT_SSH "chmod +x /home/ubuntu/vdbx/vector-db-benchmark"
            $CLIENT_SCP vector-db-benchmark-extra/datasets/datasets.json \
              ubuntu@$CLIENT_HOST:/home/ubuntu/vdbx/datasets/datasets.json
          fi

      - name: Provision server (Redis 8.10, Dragonfly)
        run: |
          SSH="ssh -i $SSH_KEY_PATH -o StrictHostKeyChecking=no -o ConnectTimeout=30 ubuntu@$SERVER_HOST"
          $SSH REDIS_DEB="${{ env.REDIS_DEB }}" DRAGONFLY_VERSION="${{ env.DRAGONFLY_VERSION }}" bash << 'REMOTE'
          set -euo pipefail

          sudo apt-get update -qq
          sudo apt-get install -y -qq ca-certificates curl gnupg lsb-release

          # Redis 8.10, native (no Docker), from the same packages.redis.io
          # apt repo benchmark.yml uses. The `redis` package brings the
          # query engine module (redisearch.so). arch=arm64 and
          # version-pinned -- see REDIS_DEB; do not drop the "=$REDIS_DEB"
          # and float on whatever's latest.
          curl -fsSL https://packages.redis.io/gpg \
            | sudo gpg --yes --dearmor -o /usr/share/keyrings/redis-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/redis-archive-keyring.gpg arch=arm64] \
            https://packages.redis.io/deb $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/redis.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq --allow-downgrades \
            "redis=${REDIS_DEB}" "redis-server=${REDIS_DEB}" "redis-tools=${REDIS_DEB}"
          MOD=$(dpkg -L redis redis-server redis-tools 2>/dev/null | grep -m1 '/redisearch\.so$' || true)
          if [[ -z "$MOD" ]]; then
            echo "::error::the Redis packages did not install redisearch.so" >&2
            exit 1
          fi
          echo "$MOD" > /home/ubuntu/redisearch-path
          redis-server --version
          # The apt package enables+starts its own systemd service on the
          # default port (6379); this workflow starts its own instance
          # explicitly on a chosen port instead (see the next step), so stop
          # the service-managed one to avoid a port clash or double-counting
          # its CPU/memory in the benchmark.
          sudo systemctl disable --now redis-server || true

          # Dragonfly: the release's native arm64 binary, as benchmark.yml
          # installs it.
          cd /home/ubuntu
          wget -q "https://github.com/dragonflydb/dragonfly/releases/download/${DRAGONFLY_VERSION}/dragonfly-aarch64.tar.gz" \
            -O dragonfly-aarch64.tar.gz
          tar -xzf dragonfly-aarch64.tar.gz
          chmod +x dragonfly-aarch64
          rm -f dragonfly-aarch64.tar.gz
          ./dragonfly-aarch64 --version
          REMOTE

      - name: Provision client (HDF5 runtime lib, engines-files)
        run: |
          SSH="ssh -i $SSH_KEY_PATH -o StrictHostKeyChecking=no -o ConnectTimeout=30 ubuntu@$CLIENT_HOST"
          $SSH bash << 'REMOTE'
          set -euo pipefail

          sudo apt-get update -qq
          # runtime lib for vector-db-benchmark's HDF5 reader; -dev pulls the
          # matching runtime .so, avoiding a guess at the exact
          # libhdf5-1xx-x package name for this Ubuntu release.
          sudo apt-get install -y -qq libhdf5-dev

          # Two SEPARATE single-entry engines-files, not one combined file --
          # the tool rejects passing --engines together with --engines-file,
          # and --engines-file alone runs *every* entry in the file with no
          # name filter, so there is no way to select just one config out of
          # a shared file. kividb uses the dedicated "kividb" engine (merged
          # upstream via PR #203 -- see top-of-file comment); Redis
          # uses the generic "redis" engine. Otherwise identical
          # (hnsw_config/search_params/upload_params), matching the
          # methodology behind the reviewed kividb-vs-Redis comparison
          # (HNSW M=16, EF_CONSTRUCTION=256; upload 100 threads/batch 64; ef
          # runtime sweep 64/128/256/512 at parallel=100) -- only `name`
          # differs, so kividb's and Redis's result files never
          # collide in the shared results/ dir.
          cat > /home/ubuntu/vdb/kividb-engine.json << 'ENGINES'
          [
            {
              "name": "kividb-glove25",
              "engine": "kividb",
              "connection_params": {},
              "collection_params": { "hnsw_config": { "M": 16, "EF_CONSTRUCTION": 256 } },
              "search_params": [
                { "parallel": 100, "search_params": { "ef": 64 } },
                { "parallel": 100, "search_params": { "ef": 128 } },
                { "parallel": 100, "search_params": { "ef": 256 } },
                { "parallel": 100, "search_params": { "ef": 512 } }
              ],
              "upload_params": { "parallel": 100, "batch_size": 64 }
            }
          ]
          ENGINES

          cat > /home/ubuntu/vdb/redis-engine.json << 'ENGINES'
          [
            {
              "name": "redis-glove25",
              "engine": "redis",
              "connection_params": {},
              "collection_params": { "hnsw_config": { "M": 16, "EF_CONSTRUCTION": 256 } },
              "search_params": [
                { "parallel": 100, "search_params": { "ef": 64 } },
                { "parallel": 100, "search_params": { "ef": 128 } },
                { "parallel": 100, "search_params": { "ef": 256 } },
                { "parallel": 100, "search_params": { "ef": 512 } }
              ],
              "upload_params": { "parallel": 100, "batch_size": 64 }
            }
          ]
          ENGINES

          # Dragonfly on glove: the same settings again under its own name
          # (report-only -- see DRAGONFLY_VERSION).
          cat > /home/ubuntu/vdb/dragonfly-engine.json << 'ENGINES'
          [
            {
              "name": "dragonfly-glove25",
              "engine": "dragonfly",
              "connection_params": {},
              "collection_params": { "hnsw_config": { "M": 16, "EF_CONSTRUCTION": 256 } },
              "search_params": [
                { "parallel": 100, "search_params": { "ef": 64 } },
                { "parallel": 100, "search_params": { "ef": 128 } },
                { "parallel": 100, "search_params": { "ef": 256 } },
                { "parallel": 100, "search_params": { "ef": 512 } }
              ],
              "upload_params": { "parallel": 100, "batch_size": 64 }
            }
          ]
          ENGINES

          # The filtered and high-dimension datasets: the settings of the
          # manual kividb-vs-Redis 8.10 runs these reproduce (HNSW M=16,
          # EF_CONSTRUCTION=128, upload 16 threads/batch 64), with ef
          # 64/128/256 at ONE client -- latency-bound, where a slower filter
          # path shows first -- and ef 128 at 16 and 100 clients for
          # throughput. One file per engine covers both datasets: the tool
          # names its result files <name>-<dataset>-..., so they never
          # collide. The kividb/redis engines index the filtered dataset's
          # metadata schema as TAG/NUMERIC fields and send each query's
          # filter, so the same file serves filtered and unfiltered data.
          mkdir -p /home/ubuntu/vdbx
          for e in kividb redis dragonfly; do
            cat > /home/ubuntu/vdbx/$e-engine.json << ENGINES
          [
            {
              "name": "$e-m16-ef128",
              "engine": "$e",
              "connection_params": {},
              "collection_params": { "hnsw_config": { "M": 16, "EF_CONSTRUCTION": 128 } },
              "search_params": [
                { "parallel": 1, "search_params": { "ef": 64 } },
                { "parallel": 1, "search_params": { "ef": 128 } },
                { "parallel": 1, "search_params": { "ef": 256 } },
                { "parallel": 16, "search_params": { "ef": 128 } },
                { "parallel": 100, "search_params": { "ef": 128 } }
              ],
              "upload_params": { "parallel": 16, "batch_size": 64 }
            }
          ]
          ENGINES
          done
          REMOTE

      # Start/stop/run helpers for the steps that came after glove's kividb
      # and Redis steps: Dragonfly, and the filtered/high-dimension datasets.
      # The same discipline as glove's own steps (which keep their inline
      # code): one engine resident at a time -- each start asserts that NO
      # engine port is open -- stop by the PID recorded at start, never by a
      # command-line pattern, and runs detached on the client and polled (see
      # the comment above glove's run steps for why). Ports: kividb 6380,
      # Redis 6381, Dragonfly 6382.
      - name: Write engine helpers
        run: |
          cat > /tmp/vecbench-helpers.sh << 'HELPERS'
          VB_OPTS="-i $SSH_KEY_PATH -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=10"

          # vb_start kividb|redis|dragonfly -- on the server.
          vb_start() {
            # shellcheck disable=SC2086
            ssh $VB_OPTS "ubuntu@$SERVER_HOST" ENGINE="$1" bash << 'REMOTE'
          set -euo pipefail
          for p in 6380 6381 6382; do
            if (exec 3<>/dev/tcp/127.0.0.1/$p) 2>/dev/null; then
              echo "::error::something is already serving on :$p before $ENGINE's phase" >&2
              exit 1
            fi
          done
          case "$ENGINE" in
            kividb)
              PORT=6380
              cd /home/ubuntu/kividb
              nohup ./kividb --bind 0.0.0.0 --port 6380 --loglevel error > /tmp/kividb.log 2>&1 &
              ;;
            redis)
              PORT=6381
              nohup redis-server --port 6381 --bind 0.0.0.0 --protected-mode no \
                --save '' --appendonly no \
                --loadmodule "$(cat /home/ubuntu/redisearch-path)" \
                > /tmp/redis.log 2>&1 &
              ;;
            dragonfly)
              # One proactor thread per core; no snapshot file (like the
              # others' no-persistence flags); its own working directory.
              PORT=6382
              ulimit -n 65535 || true
              mkdir -p /tmp/dragonfly-dir
              cd /tmp/dragonfly-dir
              nohup /home/ubuntu/dragonfly-aarch64 --port 6382 --bind 0.0.0.0 \
                --proactor_threads="$(nproc)" --dbfilename= --logtostderr \
                > /tmp/dragonfly.log 2>&1 &
              ;;
          esac
          echo $! > "/tmp/$ENGINE.pid"
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/$PORT) 2>/dev/null; then exit 0; fi
            sleep 1
          done
          echo "$ENGINE never came up on :$PORT" >&2
          tail -n 50 "/tmp/$ENGINE.log" >&2
          exit 1
          REMOTE
          }

          # vb_stop kividb|redis|dragonfly -- also prints the engine's peak
          # RSS, then waits for the port to close and the memory to settle.
          vb_stop() {
            # shellcheck disable=SC2086
            ssh $VB_OPTS "ubuntu@$SERVER_HOST" ENGINE="$1" bash << 'REMOTE'
          set -uo pipefail
          case "$ENGINE" in kividb) PORT=6380 ;; redis) PORT=6381 ;; *) PORT=6382 ;; esac
          PID="$(cat "/tmp/$ENGINE.pid" 2>/dev/null || true)"
          if [ -n "$PID" ]; then
            echo "$ENGINE peak RSS: $(awk '/VmHWM/ {print $2, $3}' "/proc/$PID/status" 2>/dev/null)"
            kill "$PID" 2>/dev/null || true
            for _ in $(seq 1 30); do
              kill -0 "$PID" 2>/dev/null || break
              sleep 1
            done
            if kill -0 "$PID" 2>/dev/null; then
              kill -9 "$PID" 2>/dev/null || true
              sleep 2
            fi
          fi
          if (exec 3<>/dev/tcp/127.0.0.1/$PORT) 2>/dev/null; then
            echo "::error::something is still serving on :$PORT after stopping $ENGINE" >&2
            exit 1
          fi
          sleep 5
          free -m || true
          REMOTE
          }

          # vb_run TAG DIR TOOL-ARGS... -- the tool in /home/ubuntu/DIR on the
          # client, detached, polled for up to 40 min (glove's budget).
          vb_run() {
            local tag="$1" dir="$2"
            shift 2
            # shellcheck disable=SC2086
            ssh $VB_OPTS "ubuntu@$CLIENT_HOST" TAG="$tag" DIR="$dir" SERVER_IP="$SERVER_PRIVATE_IP" \
              TOOL_ARGS="'$*'" bash << 'REMOTE'
          set -euo pipefail
          cd "/home/ubuntu/$DIR"
          rm -f "$TAG.log" "$TAG.exit"
          # shellcheck disable=SC2086
          nohup bash -c '
            KIVIDB_PORT=6380 REDIS_PORT=6381 DRAGONFLY_PORT=6382 ./vector-db-benchmark \
              --host "'"$SERVER_IP"'" '"$TOOL_ARGS"' --skip-if-exists false
            echo $? > "'"$TAG"'.exit"
          ' > "$TAG.log" 2>&1 < /dev/null &
          echo $! > "$TAG.pid"
          disown
          REMOTE
            echo "Polling $tag for completion (up to 40 min)..."
            local finished=0
            for _ in $(seq 1 160); do
              sleep 15
              # shellcheck disable=SC2086
              if [[ "$(ssh $VB_OPTS "ubuntu@$CLIENT_HOST" "cd /home/ubuntu/$dir && (kill -0 \$(cat $tag.pid) 2>/dev/null && echo running) || echo done")" == "done" ]]; then
                finished=1
                break
              fi
            done
            # shellcheck disable=SC2086
            ssh $VB_OPTS "ubuntu@$CLIENT_HOST" "tail -n 60 /home/ubuntu/$dir/$tag.log" || true
            if [[ "$finished" != "1" ]]; then
              echo "::error::$tag did not finish within the poll budget" >&2
              return 1
            fi
            # shellcheck disable=SC2086
            [[ "$(ssh $VB_OPTS "ubuntu@$CLIENT_HOST" "cat /home/ubuntu/$dir/$tag.exit 2>/dev/null || echo 1")" == "0" ]]
          }
          HELPERS

      # ── One engine resident at a time ───────────────────────────────────────
      #
      # This step used to start kividb AND Redis together and leave
      # both up for both phases. That quietly biases the published comparison,
      # and not symmetrically: during Redis's phase the neighbour is a
      # kividb that has just ingested 1.18M vectors, so it is holding the whole
      # index in RAM with its worker threads and background index compaction
      # still resident. During kividb's phase the neighbour is a Redis
      # that has done nothing yet. The engine measured second — always
      # Redis — therefore competes for CPU and memory against a far
      # heavier neighbour than the engine measured first.
      #
      # benchmark.yml (memtier vs Dragonfly/Redis) has always done this the
      # right way: start one engine, run it, stop it, then start the next. This
      # now mirrors that, and each start asserts the other engine is absent so
      # the two can never silently overlap again.
      - name: Start kividb on server
        if: steps.datasets.outputs.glove == 'true'
        run: |
          SSH="ssh -i $SSH_KEY_PATH -o StrictHostKeyChecking=no -o ConnectTimeout=30 ubuntu@$SERVER_HOST"
          $SSH bash << 'REMOTE'
          set -euo pipefail

          # Guard on the listening port, not on `pgrep -f`. Matching process
          # command lines is unreliable here: the pattern also matches the
          # shell running this very script (and `pkill -f` then kills it),
          # which a local dry-run of these scripts caught. The port is the
          # condition we actually care about — is the other engine serving?
          if (exec 3<>/dev/tcp/127.0.0.1/6381) 2>/dev/null; then
            echo "::error::something is already serving on :6381 — Redis must be stopped before kividb's phase" >&2
            exit 1
          fi

          cd /home/ubuntu/kividb
          # An explicit bind: the client is on another host, and with no bind
          # and no password protected mode would turn it away.
          nohup ./kividb --bind 0.0.0.0 --port 6380 --loglevel error > /tmp/kividb.log 2>&1 &
          echo $! > /tmp/kividb.pid

          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/6380) 2>/dev/null; then break; fi
            if [[ $i -eq 30 ]]; then
              echo "kividb never came up on :6380" >&2
              cat /tmp/kividb.log >&2
              exit 1
            fi
            sleep 1
          done
          REMOTE

      # Both "Run vector-db-benchmark against ..." steps launch the run
      # detached (nohup + disown) and poll for completion over short-lived
      # reconnects, rather than keeping one foreground SSH session open for
      # the whole run. The upload phase (1.18M vectors) can take many
      # minutes with ~no output over the SSH channel -- indicatif's progress
      # bar doesn't redraw against a non-tty pipe -- and a long-idle SSH
      # session like that got its connection silently killed in practice
      # ("client_loop: send disconnect: Broken pipe", exit 255, no error
      # from the tool itself) on a real run. ServerAliveInterval alone
      # wasn't trusted to fix this reliably (the drop could be an
      # intermediary NAT/idle-connection policy, not just a dead peer), so
      # this decouples the run's lifetime from the SSH session's entirely.
      - name: Run vector-db-benchmark against kividb
        if: steps.datasets.outputs.glove == 'true'
        run: |
          set -euo pipefail
          SSH="ssh -i $SSH_KEY_PATH -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 ubuntu@$CLIENT_HOST"

          $SSH DATASET="${{ env.DATASET }}" SERVER_IP="$SERVER_PRIVATE_IP" bash << 'REMOTE'
          set -euo pipefail
          cd /home/ubuntu/vdb
          rm -f kividb-run.log kividb-run.exit
          nohup bash -c '
            KIVIDB_PORT=6380 ./vector-db-benchmark \
              --host "'"$SERVER_IP"'" --engines-file kividb-engine.json \
              --datasets "'"$DATASET"'" --parallels 100 --skip-if-exists false
            echo $? > kividb-run.exit
          ' > kividb-run.log 2>&1 < /dev/null &
          echo $! > kividb-run.pid
          disown
          REMOTE

          echo "Polling for completion (up to 40 min)..."
          DONE=0
          for i in $(seq 1 160); do
            sleep 15
            if [[ "$($SSH 'cd /home/ubuntu/vdb && (kill -0 $(cat kividb-run.pid) 2>/dev/null && echo running) || echo done')" == "done" ]]; then
              DONE=1
              break
            fi
          done
          $SSH 'tail -n 100 /home/ubuntu/vdb/kividb-run.log' || true
          if [[ "$DONE" != "1" ]]; then
            echo "::error::kividb run did not finish within the poll budget" >&2
            exit 1
          fi
          EXIT_CODE="$($SSH 'cat /home/ubuntu/vdb/kividb-run.exit 2>/dev/null || echo 1')"
          [[ "$EXIT_CODE" == "0" ]]

      # kividb must be gone before Redis starts — not merely idle. It is
      # holding the whole ingested index in RAM at this point, so leaving it
      # resident is exactly the bias this ordering exists to remove.
      - name: Stop kividb on server
        if: steps.datasets.outputs.glove == 'true'
        run: |
          set -euo pipefail
          SSH="ssh -i $SSH_KEY_PATH -o StrictHostKeyChecking=no -o ConnectTimeout=30 ubuntu@$SERVER_HOST"
          $SSH bash << 'REMOTE'
          set -uo pipefail
          # Act on the PID recorded at start, not on a command-line pattern —
          # `pkill -f '/home/ubuntu/kividb/kividb'` also matches the shell
          # running this script and kills it.
          PID="$(cat /tmp/kividb.pid 2>/dev/null || true)"
          if [ -n "$PID" ]; then
            kill "$PID" 2>/dev/null || true
            for _ in $(seq 1 30); do
              kill -0 "$PID" 2>/dev/null || break
              sleep 1
            done
            if kill -0 "$PID" 2>/dev/null; then
              kill -9 "$PID" 2>/dev/null || true
              sleep 2
            fi
          fi
          if (exec 3<>/dev/tcp/127.0.0.1/6380) 2>/dev/null; then
            echo "::error::something is still serving on :6380 after stopping kividb; refusing to benchmark Redis alongside it" >&2
            exit 1
          fi
          # Let the freed memory actually settle before the next engine loads a
          # dataset of the same size into it.
          sleep 5
          free -m || true
          REMOTE

      - name: Start Redis on server
        if: steps.datasets.outputs.glove == 'true'
        run: |
          SSH="ssh -i $SSH_KEY_PATH -o StrictHostKeyChecking=no -o ConnectTimeout=30 ubuntu@$SERVER_HOST"
          $SSH bash << 'REMOTE'
          set -euo pipefail

          # Port, not `pgrep -f` — see the note on the kividb start step.
          if (exec 3<>/dev/tcp/127.0.0.1/6380) 2>/dev/null; then
            echo "::error::something is still serving on :6380 — kividb must be stopped before Redis's phase" >&2
            exit 1
          fi

          # --bind to accept the client machine's connections (protected-mode
          # off: an NSG-scoped, ephemeral, single-run box); no persistence,
          # like kividb's run; the query engine loaded explicitly.
          nohup redis-server --port 6381 --bind 0.0.0.0 --protected-mode no \
            --save '' --appendonly no \
            --loadmodule "$(cat /home/ubuntu/redisearch-path)" \
            > /tmp/redis.log 2>&1 &
          echo $! > /tmp/redis.pid

          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/6381) 2>/dev/null; then break; fi
            if [[ $i -eq 30 ]]; then
              echo "Redis never came up on :6381" >&2
              cat /tmp/redis.log >&2
              exit 1
            fi
            sleep 1
          done
          REMOTE

      - name: Run vector-db-benchmark against Redis
        if: steps.datasets.outputs.glove == 'true'
        run: |
          set -euo pipefail
          SSH="ssh -i $SSH_KEY_PATH -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 ubuntu@$CLIENT_HOST"

          $SSH DATASET="${{ env.DATASET }}" SERVER_IP="$SERVER_PRIVATE_IP" bash << 'REMOTE'
          set -euo pipefail
          cd /home/ubuntu/vdb
          rm -f redis-run.log redis-run.exit
          nohup bash -c '
            REDIS_PORT=6381 ./vector-db-benchmark \
              --host "'"$SERVER_IP"'" --engines-file redis-engine.json \
              --datasets "'"$DATASET"'" --parallels 100 --skip-if-exists false
            echo $? > redis-run.exit
          ' > redis-run.log 2>&1 < /dev/null &
          echo $! > redis-run.pid
          disown
          REMOTE

          echo "Polling for completion (up to 40 min)..."
          DONE=0
          for i in $(seq 1 160); do
            sleep 15
            if [[ "$($SSH 'cd /home/ubuntu/vdb && (kill -0 $(cat redis-run.pid) 2>/dev/null && echo running) || echo done')" == "done" ]]; then
              DONE=1
              break
            fi
          done
          $SSH 'tail -n 100 /home/ubuntu/vdb/redis-run.log' || true
          if [[ "$DONE" != "1" ]]; then
            echo "::error::Redis run did not finish within the poll budget" >&2
            exit 1
          fi
          EXIT_CODE="$($SSH 'cat /home/ubuntu/vdb/redis-run.exit 2>/dev/null || echo 1')"
          [[ "$EXIT_CODE" == "0" ]]

      # Redis must be gone before the next engine starts, for the reason
      # kividb is stopped before Redis's phase.
      - name: Stop Redis on server
        if: steps.datasets.outputs.glove == 'true'
        run: |
          set -euo pipefail
          source /tmp/vecbench-helpers.sh
          vb_stop redis

      # Dragonfly on glove: report-only. A failure here is a warning, never a
      # failed job -- but it is still stopped before anything else starts.
      - name: Run vector-db-benchmark against Dragonfly (report-only)
        if: steps.datasets.outputs.glove == 'true'
        run: |
          set -uo pipefail
          source /tmp/vecbench-helpers.sh
          if vb_start dragonfly && vb_run dragonfly-glove vdb \
              --engines-file dragonfly-engine.json --datasets "$DATASET" --parallels 100; then
            :
          else
            echo "::warning::Dragonfly on $DATASET failed; it is report-only, so the run goes on without its numbers"
          fi
          vb_stop dragonfly

      # â”€â”€ Filtered and high-dimension datasets â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      #
      # The same discipline as glove's steps above, in one loop: per dataset,
      # kividb is started fresh, benchmarked and stopped, then Redis, then
      # Dragonfly. A fresh server per dataset, not one kividb for all of them:
      # an engine still holding the previous dataset's index would be measured
      # with that index resident, the very bias the glove steps' ordering
      # comment describes. Each dataset is downloaded by the tool on first use
      # and reused by the next engines. kividb and Redis failures fail the job;
      # Dragonfly's are warnings (report-only).
      - name: Run vector-db-benchmark on the filtered/high-dimension datasets
        if: steps.datasets.outputs.extra != ''
        env:
          EXTRA: ${{ steps.datasets.outputs.extra }}
        run: |
          set -uo pipefail
          source /tmp/vecbench-helpers.sh
          for ds in $EXTRA; do
            for engine in kividb redis dragonfly; do
              echo "::group::$ds on $engine"
              ok=true
              vb_start "$engine" && vb_run "$engine-$ds" vdbx \
                --engines-file "$engine-engine.json" --engines "$engine-m16-ef128" --datasets "$ds" \
                || ok=false
              vb_stop "$engine" || exit 1
              echo "::endgroup::"
              if [[ "$ok" != true ]]; then
                if [[ "$engine" == dragonfly ]]; then
                  echo "::warning::Dragonfly on $ds failed; it is report-only, so the run goes on without its numbers"
                else
                  echo "::error::$engine run on $ds failed" >&2
                  exit 1
                fi
              fi
            done
          done

      # Safety net only. In a clean run kividb is already stopped by its own
      # step above and Redis has just finished; this catches whatever is
      # left when an earlier step failed part-way. The instances are torn down
      # afterwards regardless, so this is about not leaving a half-dead server
      # holding a port if a later step wants to retry.
      - name: Stop any remaining engines on server
        if: always()
        continue-on-error: true
        run: |
          SSH="ssh -i $SSH_KEY_PATH -o StrictHostKeyChecking=no -o ConnectTimeout=30 ubuntu@$SERVER_HOST"
          $SSH 'kill $(cat /tmp/kividb.pid) 2>/dev/null || true; kill $(cat /tmp/redis.pid) 2>/dev/null || true; kill $(cat /tmp/dragonfly.pid) 2>/dev/null || true'

      - name: Fetch results from client
        env:
          GLOVE: ${{ steps.datasets.outputs.glove }}
          EXTRA: ${{ steps.datasets.outputs.extra }}
        run: |
          set -euo pipefail
          SCP="scp -i $SSH_KEY_PATH -o StrictHostKeyChecking=no"
          # No mkdir + trailing "remote:/path/." here -- that legacy-scp idiom
          # for "copy the directory's contents into an existing local dir"
          # fails on the SFTP-based scp this runner ships ("error: unexpected
          # filename: ."). Instead: destination doesn't exist yet, so `scp -r`
          # creates it AS the copy of the remote `results` dir, which lands
          # the files at the same flat path compare_vector_baseline.py expects.
          rm -rf /tmp/vecbench-results
          if [[ "$GLOVE" == "true" ]]; then
            $SCP -r ubuntu@$CLIENT_HOST:/home/ubuntu/vdb/results /tmp/vecbench-results
          else
            mkdir -p /tmp/vecbench-results
          fi
          # The newer pin's results, into a subdirectory that does not exist
          # yet -- the same scp idiom.
          if [[ -n "$EXTRA" ]]; then
            $SCP -r ubuntu@$CLIENT_HOST:/home/ubuntu/vdbx/results /tmp/vecbench-results/extra
          fi

      - name: Upload raw results artifact
        uses: actions/upload-artifact@v4
        with:
          name: vector-bench-results-${{ github.run_id }}
          path: /tmp/vecbench-results/

      # One compare per dataset, each against its own gates (glove: the
      # baseline file's top-level blocks, unchanged; the others: their
      # "datasets.<name>" sections -- ratio floors against Redis on the same
      # run, recall within 0.01 of Redis's, and kividb within 10% of its own
      # recorded numbers once a run has recorded them; until then those rows
      # are report-only). Every dataset is compared even after one fails, so
      # the summary always shows them all; the worst exit code wins.
      - name: Compare against baseline
        id: compare
        env:
          GLOVE: ${{ steps.datasets.outputs.glove }}
          EXTRA: ${{ steps.datasets.outputs.extra }}
        run: |
          set +e
          code=0
          if [[ "$GLOVE" == "true" ]]; then
            python3 tests/e2e/benchmarks/compare_vector_baseline.py \
              --kividb-experiment kividb-glove25 --kividb-results-dir /tmp/vecbench-results \
              --redis-experiment redis-glove25 --redis-results-dir /tmp/vecbench-results \
              --dataset "${{ env.DATASET }}" \
              --dump-results-json /tmp/vecbench-results/extracted.json \
              --report-engine dragonfly=dragonfly-glove25=/tmp/vecbench-results \
              --summary-out "$GITHUB_STEP_SUMMARY"
            code=$?
          fi
          for ds in $EXTRA; do
            python3 tests/e2e/benchmarks/compare_vector_baseline.py \
              --kividb-experiment kividb-m16-ef128 --kividb-results-dir /tmp/vecbench-results/extra \
              --redis-experiment redis-m16-ef128 --redis-results-dir /tmp/vecbench-results/extra \
              --dataset "$ds" \
              --dump-results-json "/tmp/vecbench-results/extracted-$ds.json" \
              --report-engine dragonfly=dragonfly-m16-ef128=/tmp/vecbench-results/extra \
              --summary-out "$GITHUB_STEP_SUMMARY"
            c=$?
            if [[ $c -gt $code ]]; then code=$c; fi
          done
          set -e
          if [[ $code -eq 1 ]]; then
            echo "regression=true" >> "$GITHUB_OUTPUT"
          else
            echo "regression=false" >> "$GITHUB_OUTPUT"
          fi
          # A missing-file/malformed-JSON error (exit 2) is a harness
          # problem, not a performance verdict -- always fail loudly on
          # that. A real regression (exit 1) only fails the job when this
          # run isn't the deliberate one updating the baseline.
          if [[ $code -eq 2 ]]; then
            exit 2
          fi
          if [[ $code -eq 1 && "${{ inputs.update_baseline }}" != "true" ]]; then
            exit 1
          fi
          exit 0

      - name: Upload extracted (compact) results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vector-bench-extracted-${{ github.run_id }}
          path: /tmp/vecbench-results/extracted*.json
          if-no-files-found: ignore

  # ── Optional: record a new baseline (manual dispatch only) ──────────────
  update-baseline:
    needs: benchmark
    if: ${{ inputs.update_baseline }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref_name }}

      - uses: actions/download-artifact@v4
        with:
          name: vector-bench-extracted-${{ github.run_id }}
          path: /tmp/extracted

      - name: Rewrite benchmarks/vector-baseline.json from this run's results
        run: |
          python3 - << 'PY'
          import json, pathlib
          baseline_path = pathlib.Path("benchmarks/vector-baseline.json")
          baseline = json.loads(baseline_path.read_text())

          # kividb_absolute gate "baseline" values are re-derived from
          # baseline["kividb"] at compare time (see compare_vector_baseline.py),
          # not stored per-gate -- so rewriting the two blocks above is
          # sufficient; nothing else in "gates" needs updating.
          # glove (extracted.json) is only rewritten when this run included it.
          glove = pathlib.Path("/tmp/extracted/extracted.json")
          if glove.exists():
              extracted = json.loads(glove.read_text())
              baseline["kividb"] = extracted["kividb"]
              baseline["redis"] = extracted["redis"]
          # The other datasets (extracted-<dataset>.json): the same two
          # blocks, inside their own "datasets.<dataset>" section.
          for path in sorted(pathlib.Path("/tmp/extracted").glob("extracted-*.json")):
              ds = path.name[len("extracted-"):-len(".json")]
              extracted = json.loads(path.read_text())
              section = baseline["datasets"][ds]
              section["kividb"] = extracted["kividb"]
              section["redis"] = extracted["redis"]

          baseline["_provenance"] = (
              "Updated by .github/workflows/vector-benchmark.yml run "
              "${{ github.run_id }} (workflow_dispatch, update_baseline=true)."
          )
          baseline_path.write_text(json.dumps(baseline, indent=2) + "\n")
          PY

      - name: Open a pull request with the new baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add benchmarks/vector-baseline.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          # A pull request, not a push: master changes only through review.
          BRANCH="benchmark-results/${{ github.run_id }}"
          git switch -c "$BRANCH"
          git commit -m "Vector benchmark baseline from run ${{ github.run_id }}"
          git push origin "$BRANCH"
          gh pr create --base "$BASE" --head "$BRANCH" \
            --title "Vector benchmark baseline from run ${{ github.run_id }}" \
            --body "From run [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."

  # ── Always tear down, regardless of benchmark outcome ────────────────────
  destroy:
    needs: [launch, benchmark]
    if: always()
    uses: ./.github/workflows/_benchmark-destroy.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write
