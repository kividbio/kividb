name: (reusable) Create benchmark machines

# Two arm64 Azure VMs (server + client) in the kividb-benchmark resource
# group, created by infra/benchmark-azure/create.sh. Signs in to Azure with
# GitHub's OIDC token: no Azure secret is stored. The app registration trusts
# runs on master only, so dispatch benchmark workflows from master and pick
# the branch to measure with their `ref` input.
on:
  workflow_call:
    inputs:
      location:
        type: string
        default: "centralindia"
      server_size:
        type: string
        default: "Standard_D32ps_v5"
      client_size:
        type: string
        default: "Standard_D32ps_v5"
      # Both machines in one datacenter: the lowest latency between them.
      # Turn off if Azure cannot place the pair together.
      use_proximity_group:
        type: boolean
        default: true
      # true: the server warms Dragonfly/Redis, the client builds memtier and
      # Rust and registers as this run's self-hosted runner. false: bare
      # Ubuntu, reached over SSH from GitHub-hosted runners.
      bootstrap:
        type: boolean
        default: true
    outputs:
      run_id:
        value: ${{ jobs.create.outputs.run_id }}
      resource_group:
        value: ${{ jobs.create.outputs.resource_group }}
      server_private_ip:
        value: ${{ jobs.create.outputs.server_private_ip }}
      server_public_ip:
        value: ${{ jobs.create.outputs.server_public_ip }}
      client_public_ip:
        value: ${{ jobs.create.outputs.client_public_ip }}
      ssh_user:
        value: ${{ jobs.create.outputs.ssh_user }}
      ssh_key_path:
        value: ${{ jobs.create.outputs.ssh_key_path }}
      runner_label:
        value: ${{ jobs.create.outputs.runner_label }}

permissions:
  contents: read
  id-token: write

env:
  # Fixed on purpose: every job that SSHes writes the same secret to this
  # same path, so no `-i` argument differs between jobs.
  SSH_KEY_PATH: /tmp/kividb_benchmark_ssh_key
  RESOURCE_GROUP: kividb-benchmark

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      run_id: ${{ steps.create.outputs.run_id }}
      resource_group: ${{ steps.create.outputs.resource_group }}
      server_private_ip: ${{ steps.create.outputs.server_private_ip }}
      server_public_ip: ${{ steps.create.outputs.server_public_ip }}
      client_public_ip: ${{ steps.create.outputs.client_public_ip }}
      ssh_user: ${{ steps.create.outputs.ssh_user }}
      ssh_key_path: ${{ env.SSH_KEY_PATH }}
      runner_label: run-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Write SSH private key and derive its public half
        id: ssh
        env:
          BENCHMARK_SSH_PRIVATE_KEY: ${{ secrets.BENCHMARK_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$BENCHMARK_SSH_PRIVATE_KEY" ]]; then
            echo "::error::secrets.BENCHMARK_SSH_PRIVATE_KEY is not set."
            exit 1
          fi
          umask 077
          printf '%s\n' "$BENCHMARK_SSH_PRIVATE_KEY" > "$SSH_KEY_PATH"
          chmod 600 "$SSH_KEY_PATH"
          echo "public_key=$(ssh-keygen -y -f "$SSH_KEY_PATH")" >> "$GITHUB_OUTPUT"

      # Short-lived, minted just in time. The default GITHUB_TOKEN cannot call
      # this endpoint: it needs a PAT with Administration: write on the repo.
      - name: Mint runner registration token
        id: reg
        if: inputs.bootstrap
        env:
          GH_RUNNER_PAT: ${{ secrets.GH_RUNNER_PAT }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_RUNNER_PAT" ]]; then
            echo "::error::secrets.GH_RUNNER_PAT is not set (needs Administration: write on this repo)."
            exit 1
          fi
          TOKEN=$(curl -sf -X POST \
            -H "Authorization: token $GH_RUNNER_PAT" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runners/registration-token" \
            | jq -r .token)
          if [[ -z "$TOKEN" || "$TOKEN" == "null" ]]; then
            echo "::error::Failed to mint a runner registration token."
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Create server and client
        id: create
        env:
          # The attempt number keeps a re-run's machines apart from what an
          # earlier attempt may have left; destroy clears every attempt.
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          SSH_PUBLIC_KEY: ${{ steps.ssh.outputs.public_key }}
          LOCATION: ${{ inputs.location }}
          SERVER_SIZE: ${{ inputs.server_size }}
          CLIENT_SIZE: ${{ inputs.client_size }}
          USE_PROXIMITY_GROUP: ${{ inputs.use_proximity_group }}
          BOOTSTRAP: ${{ inputs.bootstrap }}
          REGISTER_RUNNER: ${{ inputs.bootstrap }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUNNER_TOKEN: ${{ steps.reg.outputs.token }}
          RUNNER_LABELS: self-hosted,benchmark,client,run-${{ github.run_id }}
        run: bash infra/benchmark-azure/create.sh

      - name: Wait for SSH on both machines
        if: ${{ !inputs.bootstrap }}
        env:
          HOSTS: ${{ steps.create.outputs.server_public_ip }} ${{ steps.create.outputs.client_public_ip }}
        run: |
          set -euo pipefail
          for host in $HOSTS; do
            for i in $(seq 1 30); do
              if ssh -i "$SSH_KEY_PATH" -o StrictHostKeyChecking=no -o ConnectTimeout=5 \
                   ubuntu@"$host" 'echo ready' 2>/dev/null; then
                break
              fi
              if [[ $i -eq 30 ]]; then
                echo "::error::SSH never came up on $host"
                exit 1
              fi
              sleep 10
            done
          done

      # The benchmark job runs on the runner the client's startup script
      # registers. If that script fails, no runner ever registers and the job
      # waits in the queue for hours with both machines running. So this job
      # does not succeed until the runner is there, and prints the end of the
      # client's startup log if it is not.
      - name: Wait for the runner to register
        if: inputs.bootstrap
        env:
          GH_RUNNER_PAT: ${{ secrets.GH_RUNNER_PAT }}
          RUNNER_LABEL: run-${{ github.run_id }}
          CLIENT_NAME: ${{ steps.create.outputs.client_name }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 20 * 60 ))
          while true; do
            status=$(curl -sf \
              -H "Authorization: token $GH_RUNNER_PAT" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runners?per_page=100" \
              | jq -r --arg want "$RUNNER_LABEL" \
                  '[.runners[] | select(any(.labels[]; .name == $want)) | .status] | first // "absent"' \
              || echo "unknown")
            if [[ "$status" == "online" ]]; then
              echo "Runner $RUNNER_LABEL is online."
              exit 0
            fi
            if (( $(date +%s) >= deadline )); then
              break
            fi
            echo "Runner $RUNNER_LABEL: $status; waiting."
            sleep 20
          done
          echo "::error::The client did not register a runner within 20 minutes (last seen: $status). The end of its startup log follows."
          az vm run-command invoke -g "$RESOURCE_GROUP" -n "$CLIENT_NAME" \
            --command-id RunShellScript --scripts "tail -n 80 /var/log/user-data-client.log" \
            --query 'value[0].message' -o tsv || true
          exit 1
