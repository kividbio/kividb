name: (reusable) Destroy benchmark machines

# Deletes every resource infra/benchmark-azure/create.sh made for this run,
# found by name ("kvb-<run id>-..."), so it works whether create finished,
# failed half way or was cancelled, and needs nothing handed over from it.
on:
  workflow_call:

permissions:
  contents: read
  id-token: write

jobs:
  destroy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Delete server, client and their network
        env:
          RUN_PREFIX: ${{ github.run_id }}
          RESOURCE_GROUP: kividb-benchmark
        run: bash infra/benchmark-azure/destroy.sh

      - name: Deregister any lingering runner (safety net)
        # Normal path: the client's --ephemeral runner deregisters itself
        # after its one job. This only matters if it never got that far.
        if: always()
        continue-on-error: true
        env:
          GH_RUNNER_PAT: ${{ secrets.GH_RUNNER_PAT }}
          RUN_LABEL: run-${{ github.run_id }}
        run: |
          set -euo pipefail
          [[ -z "$GH_RUNNER_PAT" ]] && exit 0
          ids=$(curl -sf -H "Authorization: token $GH_RUNNER_PAT" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runners?per_page=100" \
            | jq -r --arg label "$RUN_LABEL" '.runners[] | select(.labels[].name == $label) | .id')
          for id in $ids; do
            echo "Removing leftover runner id=$id (label=$RUN_LABEL)"
            curl -sf -X DELETE -H "Authorization: token $GH_RUNNER_PAT" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runners/$id" || true
          done
