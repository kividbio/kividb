name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.2.3)"
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  NFPM_VERSION: "2.41.0"
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

# ── Feature variants ─────────────────────────────────────────────────────────
#
#   name     features      tarball suffix   Docker manifest tag
#   -------  ------------  ---------------  -----------------------------------
#   default  (none)        (none)           v1.2.3 · MAJOR.MINOR · latest
#   lua      lua           -lua             v1.2.3-lua
#   tls      tls           -tls             v1.2.3-tls
#   full     lua,tls       -full            v1.2.3-full
#
# The Linux jobs of the default and full variants also produce .deb / .rpm
# packages: `kividb` and `kividb-full`, which conflict with each other
# (packaging/nfpm-config.sh; docs/INSTALL.md, "Switching between kividb and
# kividb-full").
# ─────────────────────────────────────────────────────────────────────────────

jobs:

  # ── Tag must match Cargo.toml ────────────────────────────────────────────
  # The engine reports its version from CARGO_PKG_VERSION (INFO's
  # kividb_version, HELLO, LOLWUT). If Cargo.toml says 1.0.4 while the tag
  # says v1.0.4-rc2, every running instance claims to be a stable release
  # that was never cut -- which has already misled downstream tooling
  # into offering an upgrade to a version that does not exist, and made two
  # different builds of "rc1" indistinguishable after a tag was recreated.
  #
  # Cheap, and it gates every build job below, so a mismatched tag fails in
  # seconds instead of after a full multi-arch publish.
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          # The regression gate below walks history (is the measured commit an
          # ancestor of the tag).
          fetch-depth: 0
      - name: Cargo.toml version equals the release tag
        run: |
          set -euo pipefail
          want="${RELEASE_TAG#v}"
          # First `version =` after [package]; the [lib]/[[bin]] tables above
          # it have no version key, but dependencies below it do.
          have="$(awk '/^\[package\]/{p=1;next} /^\[/{p=0} p&&/^version *=/{gsub(/[" ]/,"");sub(/^version=/,"");print;exit}' Cargo.toml)"
          echo "tag=${want} cargo=${have}"
          if [ "${want}" != "${have}" ]; then
            echo "::error::Cargo.toml version '${have}' does not match release tag '${RELEASE_TAG}'. Bump Cargo.toml (and Cargo.lock) before tagging -- the engine reports this string as kividb_version."
            exit 1
          fi

      # A stable tag needs a committed regression-suite result for the code it
      # ships: a passing run of benchmarks/X.Y.0/regressions on the final
      # release candidate, with src/ unchanged since. Release candidates are
      # not checked, and neither is a minor release that has no suite. Runs
      # here, before any build job, so a missing result fails in seconds.
      # Details and how to produce the result: docs/RELEASING.md, "Before
      # tagging". Locally: scripts/release/check-regression-results.sh vX.Y.Z
      - name: Regression suite result is committed for this code
        run: bash scripts/release/check-regression-results.sh "${RELEASE_TAG}" --ref HEAD

  # ── Linux x86_64 ─────────────────────────────────────────────────────────
  # Built INSIDE an amazonlinux:2023 container, not natively on the runner:
  # ubuntu-latest's glibc (2.39+) is newer than Amazon Linux 2023's glibc
  # (2.34), so a plain `cargo build` on the runner produces a binary that
  # instantly fails with "GLIBC_2.38 not found". musl (statically linked, no
  # glibc dependency) was tried first but tokio-uring 0.5's libc bindings
  # (statx, msghdr.msg_controllen) don't compile against musl's libc at all —
  # not a config issue, a real upstream incompatibility. Building on AL2023
  # itself sidesteps that: same glibc as the deploy target, by construction.
  linux-amd64:
    needs: [verify-version]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant:
          - { name: default, features: "",        tarball: "kividb-linux-x86_64",      package: "kividb"      }
          - { name: lua,     features: "lua",     tarball: "kividb-lua-linux-x86_64",  package: ""            }
          - { name: tls,     features: "tls",     tarball: "kividb-tls-linux-x86_64",  package: ""            }
          - { name: full,    features: "lua,tls", tarball: "kividb-full-linux-x86_64", package: "kividb-full" }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Install nfpm
        if: matrix.variant.package != ''
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar xz -C /usr/local/bin nfpm
          nfpm --version

      - name: Build binary (${{ matrix.variant.name }}) on Amazon Linux 2023
        run: |
          set -euo pipefail
          FEATURES="${{ matrix.variant.features }}"
          docker run --rm -v "${PWD}:/workspace" -w /workspace \
            -e FEATURES="${FEATURES}" \
            amazonlinux:2023 bash -c '
              set -euo pipefail
              dnf install -y gcc gcc-c++ make cmake perl git openssl-devel pkgconfig nasm >/dev/null
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
              sh /tmp/rustup.sh -y --profile minimal --default-toolchain stable
              source "$HOME/.cargo/env"
              cargo build --release ${FEATURES:+--features "${FEATURES}"}
            '

      - name: Build .deb and .rpm
        if: matrix.variant.package != ''
        run: |
          set -euo pipefail
          ver="${RELEASE_TAG#v}"
          pkg="${{ matrix.variant.package }}"
          if [ -f packaging/nfpm-config.sh ]; then
            sh packaging/nfpm-config.sh "${{ matrix.variant.name }}" "${ver}" amd64 > /tmp/nfpm.yaml
          elif [ "$pkg" = kividb ]; then
            # A tag from before kividb-full (#732), released again from this
            # workflow: the kividb package as it was made then.
            echo "::notice::${RELEASE_TAG} has no packaging/nfpm-config.sh: the kividb package only"
            sed -e "s/^version:.*/version: ${ver}/" -e "s/^arch:.*/arch: amd64/" packaging/nfpm.yaml > /tmp/nfpm.yaml
          else
            echo "::notice::${RELEASE_TAG} is from before kividb-full (#732): no $pkg package"
            exit 0
          fi
          mkdir -p dist
          nfpm pkg -f /tmp/nfpm.yaml --packager deb --target "dist/${pkg}_amd64.deb"
          nfpm pkg -f /tmp/nfpm.yaml --packager rpm --target "dist/${pkg}.x86_64.rpm"

      - name: Stage tarball
        run: |
          set -euo pipefail
          mkdir -p dist staging/kividb
          cp target/release/kividb staging/kividb/kividb
          cp LICENSE staging/kividb/LICENSE
          cp NOTICE staging/kividb/NOTICE
          tar czf "dist/${{ matrix.variant.tarball }}.tar.gz" -C staging kividb

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux-amd64-${{ matrix.variant.name }}
          path: dist/*

  # ── The packages, swapped for each other ────────────────────────────────
  # `kividb` and `kividb-full` install the same files: install one, swap to
  # the other and back, and upgrade, in clean Debian 12, Ubuntu 24.04, Rocky
  # Linux 9 and Amazon Linux 2023 containers running systemd, with this
  # release's x86_64 binaries (packaging/test/swap-test.sh). `publish` waits
  # for it. About 15 to 20 minutes, once per release.
  package-test:
    needs: [linux-amd64]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          persist-credentials: false
      # A tag from before kividb-full (#732), released again from this
      # workflow, has neither the test nor the package: nothing to test.
      - name: Is there a test
        id: have
        run: |
          if [ -f packaging/test/swap-test.sh ]; then
            echo "test=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::${RELEASE_TAG} has no packaging/test/swap-test.sh: the packages are not tested"
            echo "test=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Download the x86_64 builds
        if: steps.have.outputs.test == 'true'
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: dist-linux-amd64-*
          merge-multiple: true
      - name: Install nfpm
        if: steps.have.outputs.test == 'true'
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar xz -C /usr/local/bin nfpm
      # The test's own packages, built from the release's binaries, and the
      # release's packages themselves (SHIPPED_DIR): their fields checked,
      # and installed and swapped once.
      - name: Install, swap, swap back and upgrade
        if: steps.have.outputs.test == 'true'
        env:
          SHIPPED_DIR: artifacts
        run: |
          set -euo pipefail
          mkdir -p bins/default bins/full
          tar xzf artifacts/kividb-linux-x86_64.tar.gz -C bins/default
          tar xzf artifacts/kividb-full-linux-x86_64.tar.gz -C bins/full
          SHIPPED_VERSION="${RELEASE_TAG#v}" \
            bash packaging/test/swap-test.sh bins/default/kividb/kividb bins/full/kividb/kividb
      - name: Logs
        if: failure()
        run: tail -n +1 target/pkgtest/*.log || true

  # ── Linux aarch64 ────────────────────────────────────────────────────────
  # Built INSIDE an amazonlinux:2023 container — see the linux-amd64 job's
  # comment for why (musl doesn't work here at all: tokio-uring 0.5 doesn't
  # compile against musl's libc bindings, and a native build on this runner's
  # own newer glibc is what crash-looped every new instance in the first
  # place). amazonlinux:2023 is a genuine multi-arch image, so this runs
  # natively on this arm64 runner — no emulation, no cross-rs involved.
  linux-arm64:
    needs: [verify-version]
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        variant:
          - { name: default, features: "",        tarball: "kividb-linux-aarch64",      package: "kividb"      }
          - { name: lua,     features: "lua",     tarball: "kividb-lua-linux-aarch64",  package: ""            }
          - { name: tls,     features: "tls",     tarball: "kividb-tls-linux-aarch64",  package: ""            }
          - { name: full,    features: "lua,tls", tarball: "kividb-full-linux-aarch64", package: "kividb-full" }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Install nfpm
        if: matrix.variant.package != ''
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_arm64.tar.gz" \
            | sudo tar xz -C /usr/local/bin nfpm
          nfpm --version

      - name: Build binary (${{ matrix.variant.name }}) on Amazon Linux 2023
        run: |
          set -euo pipefail
          FEATURES="${{ matrix.variant.features }}"
          docker run --rm -v "${PWD}:/workspace" -w /workspace \
            -e FEATURES="${FEATURES}" \
            amazonlinux:2023 bash -c '
              set -euo pipefail
              dnf install -y gcc gcc-c++ make cmake perl git openssl-devel pkgconfig >/dev/null
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
              sh /tmp/rustup.sh -y --profile minimal --default-toolchain stable
              source "$HOME/.cargo/env"
              # Atomics as single instructions (LSE), not as calls that choose
              # at run time between those and the ARMv8.0 loops: every lock
              # and every count is one. It needs ARMv8.1, which every arm64
              # server has had since Graviton2; a Raspberry Pi 4 has not.
              export RUSTFLAGS="-C target-feature=+lse"
              cargo build --release ${FEATURES:+--features "${FEATURES}"}
            '

      - name: Build .deb and .rpm
        if: matrix.variant.package != ''
        run: |
          set -euo pipefail
          ver="${RELEASE_TAG#v}"
          pkg="${{ matrix.variant.package }}"
          if [ -f packaging/nfpm-config.sh ]; then
            sh packaging/nfpm-config.sh "${{ matrix.variant.name }}" "${ver}" arm64 > /tmp/nfpm.yaml
          elif [ "$pkg" = kividb ]; then
            # A tag from before kividb-full (#732), released again from this
            # workflow: the kividb package as it was made then.
            echo "::notice::${RELEASE_TAG} has no packaging/nfpm-config.sh: the kividb package only"
            sed -e "s/^version:.*/version: ${ver}/" -e "s/^arch:.*/arch: arm64/" packaging/nfpm.yaml > /tmp/nfpm.yaml
          else
            echo "::notice::${RELEASE_TAG} is from before kividb-full (#732): no $pkg package"
            exit 0
          fi
          mkdir -p dist
          nfpm pkg -f /tmp/nfpm.yaml --packager deb --target "dist/${pkg}_arm64.deb"
          nfpm pkg -f /tmp/nfpm.yaml --packager rpm --target "dist/${pkg}.aarch64.rpm"

      - name: Stage tarball
        run: |
          set -euo pipefail
          mkdir -p dist staging/kividb
          cp target/release/kividb staging/kividb/kividb
          cp LICENSE staging/kividb/LICENSE
          cp NOTICE staging/kividb/NOTICE
          tar czf "dist/${{ matrix.variant.tarball }}.tar.gz" -C staging kividb

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux-arm64-${{ matrix.variant.name }}
          path: dist/*

  # ── macOS (Apple Silicon + Intel) ────────────────────────────────────────
  # Not for a release candidate (a tag with a `-` in it): a macOS minute is
  # billed as ten, and nobody installs a candidate with Homebrew. A candidate
  # is published with its Linux binaries, packages and images only.
  darwin:
    needs: [verify-version]
    if: ${{ !contains(github.event.inputs.tag || github.ref_name, '-') }}
    runs-on: macos-latest
    strategy:
      matrix:
        variant:
          - { name: default, features: "",        tarball_prefix: "kividb"      }
          - { name: lua,     features: "lua",     tarball_prefix: "kividb-lua"  }
          - { name: tls,     features: "tls",     tarball_prefix: "kividb-tls"  }
          - { name: full,    features: "lua,tls", tarball_prefix: "kividb-full" }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: darwin-${{ matrix.variant.name }}

      - name: Build binary (${{ matrix.variant.name }})
        run: |
          FEATURES="${{ matrix.variant.features }}"
          cargo build --release --target aarch64-apple-darwin ${FEATURES:+--features "${FEATURES}"}
          cargo build --release --target x86_64-apple-darwin  ${FEATURES:+--features "${FEATURES}"}

      - name: Stage tarballs
        run: |
          set -euo pipefail
          mkdir -p dist staging-arm64/kividb staging-x86/kividb

          cp target/aarch64-apple-darwin/release/kividb staging-arm64/kividb/kividb
          cp LICENSE staging-arm64/kividb/LICENSE
          cp NOTICE staging-arm64/kividb/NOTICE
          tar czf "dist/${{ matrix.variant.tarball_prefix }}-darwin-aarch64.tar.gz" -C staging-arm64 kividb

          cp target/x86_64-apple-darwin/release/kividb staging-x86/kividb/kividb
          cp LICENSE staging-x86/kividb/LICENSE
          cp NOTICE staging-x86/kividb/NOTICE
          tar czf "dist/${{ matrix.variant.tarball_prefix }}-darwin-x86_64.tar.gz" -C staging-x86 kividb

      - uses: actions/upload-artifact@v4
        with:
          name: dist-darwin-${{ matrix.variant.name }}
          path: dist/*

  # ── Docker: build each platform image on its native runner ───────────────
  #
  # Per-arch intermediate tags (sources for docker-manifest):
  #
  #   Variant   amd64 tag               arm64 tag
  #   -------   ----------------------  ----------------------
  #   default   {TAG}-amd64             {TAG}-arm64
  #   lua       {TAG}-lua-amd64         {TAG}-lua-arm64
  #   tls       {TAG}-tls-amd64         {TAG}-tls-arm64
  #   full      {TAG}-full-amd64        {TAG}-full-arm64
  #
  # Final multi-arch manifest tags:
  #
  #   default → {TAG}  ·  MAJOR.MINOR  ·  latest   (stable only)
  #   lua     → {TAG}-lua
  #   tls     → {TAG}-tls
  #   full    → {TAG}-full

  docker-amd64:
    needs: [linux-amd64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        variant:
          - { name: default, features: "",        arch_tag: "amd64"      }
          - { name: lua,     features: "lua",     arch_tag: "lua-amd64"  }
          - { name: tls,     features: "tls",     arch_tag: "tls-amd64"  }
          - { name: full,    features: "lua,tls", arch_tag: "full-amd64" }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (${{ matrix.variant.name }}, amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            KIVIDB_FEATURES=${{ matrix.variant.features }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ env.RELEASE_TAG }}-${{ matrix.variant.arch_tag }}
          cache-from: type=gha,scope=${{ matrix.variant.name }}-amd64
          cache-to: type=gha,mode=max,scope=${{ matrix.variant.name }}-amd64

      # A critical or high CVE with a fix released stops the release here,
      # before docker-manifest gives the image its public tags. CVEs with no
      # fix are listed but do not fail: there is nothing to rebuild with.
      - name: Scan image (${{ matrix.variant.name }}, amd64)
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ env.RELEASE_TAG }}-${{ matrix.variant.arch_tag }}
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "$IMAGE"
          trivy() {
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$HOME/.cache/trivy:/root/.cache/trivy" \
              aquasec/trivy:0.58.1 image --quiet --image-src docker --scanners vuln "$@" "$IMAGE"
          }
          trivy --format table
          trivy --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 --format table

  docker-arm64:
    needs: [linux-arm64]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        variant:
          - { name: default, features: "",        arch_tag: "arm64"      }
          - { name: lua,     features: "lua",     arch_tag: "lua-arm64"  }
          - { name: tls,     features: "tls",     arch_tag: "tls-arm64"  }
          - { name: full,    features: "lua,tls", arch_tag: "full-arm64" }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (${{ matrix.variant.name }}, arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          build-args: |
            KIVIDB_FEATURES=${{ matrix.variant.features }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ env.RELEASE_TAG }}-${{ matrix.variant.arch_tag }}
          cache-from: type=gha,scope=${{ matrix.variant.name }}-arm64
          cache-to: type=gha,mode=max,scope=${{ matrix.variant.name }}-arm64

      # A critical or high CVE with a fix released stops the release here,
      # before docker-manifest gives the image its public tags. CVEs with no
      # fix are listed but do not fail: there is nothing to rebuild with.
      - name: Scan image (${{ matrix.variant.name }}, arm64)
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ env.RELEASE_TAG }}-${{ matrix.variant.arch_tag }}
        run: |
          set -euo pipefail
          docker pull --platform linux/arm64 "$IMAGE"
          trivy() {
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$HOME/.cache/trivy:/root/.cache/trivy" \
              aquasec/trivy:0.58.1 image --quiet --image-src docker --scanners vuln "$@" "$IMAGE"
          }
          trivy --format table
          trivy --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 --format table

  docker-manifest:
    # Waits for ALL matrix instances of both docker-amd64 and docker-arm64.
    needs: [docker-amd64, docker-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Signed build provenance for the images (see the last steps).
      id-token: write
      attestations: write
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub gets the same multi-arch tags, copied from GHCR below: the
      # per-arch images are only ever pushed to GHCR.
      - name: Check Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo "::error::Set the DOCKERHUB_USERNAME variable and the DOCKERHUB_TOKEN secret (a Docker Hub access token with Read & Write on kividb/kividb)."
            exit 1
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push multi-arch manifests
        env:
          TAG: ${{ env.RELEASE_TAG }}
          SRC: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail

          VER="${TAG#v}"
          MAJOR_MINOR=$(echo "${VER}" | sed 's/\([0-9]*\.[0-9]*\)\..*/\1/')

          # Stable = no pre-release suffix (no hyphen after the semver core)
          IS_STABLE=false
          case "${VER}" in *-*) IS_STABLE=false ;; *) IS_STABLE=true ;; esac

          for registry in "${SRC}" "docker.io/kividb/kividb"; do
            for variant in default lua tls full; do
              # Resolve the per-arch infix used when images were pushed
              if [ "${variant}" = "default" ]; then
                infix=""
              else
                infix="${variant}-"
              fi

              AMD64="${SRC}:${TAG}-${infix}amd64"
              ARM64="${SRC}:${TAG}-${infix}arm64"

              if [ "${variant}" = "default" ]; then
                # Exact version tag (e.g. v1.2.3)
                docker buildx imagetools create -t "${registry}:${TAG}" "${AMD64}" "${ARM64}"

                # Floating tags — stable releases only
                if [ "${IS_STABLE}" = "true" ]; then
                  docker buildx imagetools create -t "${registry}:${MAJOR_MINOR}" "${AMD64}" "${ARM64}"
                  docker buildx imagetools create -t "${registry}:latest"          "${AMD64}" "${ARM64}"
                fi
              else
                # Named variant tag (e.g. v1.2.3-lua, v1.2.3-tls, v1.2.3-full)
                docker buildx imagetools create -t "${registry}:${TAG}-${variant}" "${AMD64}" "${ARM64}"
              fi
            done
          done

      # The digest of each variant's multi-arch manifest on GHCR, for its
      # attestation. Docker Hub's copy is the same manifest, with the same
      # digest, so one attestation answers for both.
      - name: Image digests
        id: digests
        env:
          TAG: ${{ env.RELEASE_TAG }}
          SRC: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          for variant in default lua tls full; do
            if [ "${variant}" = "default" ]; then ref="${SRC}:${TAG}"; else ref="${SRC}:${TAG}-${variant}"; fi
            digest=$(docker buildx imagetools inspect "${ref}" --format '{{json .Manifest.Digest}}' | tr -d '"')
            case "${digest}" in sha256:*) ;; *) echo "::error::no digest for ${ref}: ${digest}"; exit 1 ;; esac
            echo "${variant}=${digest}" >> "$GITHUB_OUTPUT"
            echo "${ref} ${digest}"
          done

      # Signed build provenance for each image: anyone can check one with
      # `gh attestation verify oci://ghcr.io/kividbio/kividb:<tag> --repo
      # kividbio/kividb`. Pushed to GHCR beside the image as well.
      - name: Attest image provenance (default)
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.digests.outputs.default }}
          push-to-registry: true
      - name: Attest image provenance (lua)
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.digests.outputs.lua }}
          push-to-registry: true
      - name: Attest image provenance (tls)
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.digests.outputs.tls }}
          push-to-registry: true
      - name: Attest image provenance (full)
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.digests.outputs.full }}
          push-to-registry: true

  # Stable releases only: a candidate has no macOS binaries (see `darwin`),
  # and the tap is what `brew install kividb` gives people. v1.0.6-rc1 went
  # out through it to everybody.
  homebrew-tap-update:
    needs: [publish]
    if: ${{ !contains(github.event.inputs.tag || github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      # formula.sh, from this workflow's own commit: the tag's for a tag
      # pushed, and the branch's when an older tag, from before formula.sh,
      # is released again by hand.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: kividb
          persist-credentials: false

      - name: Checkout tap repository
        uses: actions/checkout@v4
        with:
          repository: kividbio/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          ref: master
          path: tap

      # Formula/kividb.rb, the default variant, and Formula/kividb-full.rb,
      # Lua and TLS (#732). Each conflicts with the other: both install
      # bin/kividb. formula.sh refuses a missing checksum.
      - name: Write the formulas
        id: extract
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          # SHA256SUMS.txt is published as an asset of the GitHub Release.
          curl -fsSL "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/SHA256SUMS.txt" -o /tmp/SHA256SUMS.txt
          sha() { awk -v f="$1" '$2 == f || $2 == "./" f { print $1 }' /tmp/SHA256SUMS.txt; }

          mkdir -p tap/Formula
          sh kividb/packaging/homebrew/formula.sh default "${VERSION}" "${{ github.repository }}" \
            "$(sha kividb-darwin-aarch64.tar.gz)" "$(sha kividb-darwin-x86_64.tar.gz)" > tap/Formula/kividb.rb
          if [ -n "$(sha kividb-full-darwin-aarch64.tar.gz)" ]; then
            sh kividb/packaging/homebrew/formula.sh full "${VERSION}" "${{ github.repository }}" \
              "$(sha kividb-full-darwin-aarch64.tar.gz)" "$(sha kividb-full-darwin-x86_64.tar.gz)" > tap/Formula/kividb-full.rb
          else
            echo "::notice::v${VERSION} has no kividb-full macOS tarballs: Formula/kividb-full.rb is left as it is"
          fi
          cat tap/Formula/kividb.rb

      - name: Commit and push
        working-directory: tap
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/kividb.rb
          if [ -f Formula/kividb-full.rb ]; then git add Formula/kividb-full.rb; fi
          # What this run wrote: kividb-full only when its tarballs exist.
          what=kividb
          if git diff --cached --quiet -- Formula/kividb-full.rb; then :; else what="kividb and kividb-full"; fi
          # A re-run after the formulas were already pushed has nothing to add.
          if git diff --cached --quiet; then
            echo "The tap already has kividb ${{ steps.extract.outputs.version }}."
            exit 0
          fi
          git commit -m "chore: update ${what} to ${{ steps.extract.outputs.version }}"
          git push

  # ── apt and dnf repositories — stable releases only ─────────────────────
  #
  # Adds the release's .deb and .rpm, taken from the GitHub Release just
  # published, to https://packages.kividb.io and signs the repositories: see
  # package-repos.yml. `publish` runs for stable releases only, so a
  # candidate never gets here. Skipped with a notice until the signing key
  # and the deploy key are set (docs/INSTALL.md, "Maintainers: one-time
  # setup"). Only the secrets it uses are passed; those in its `packages`
  # environment take their place.
  package-repos:
    needs: [publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    permissions:
      contents: read
      attestations: read
    uses: ./.github/workflows/package-repos.yml
    with:
      tag: ${{ github.event.inputs.tag || github.ref_name }}
    secrets:
      PACKAGES_GPG_PRIVATE_KEY: ${{ secrets.PACKAGES_GPG_PRIVATE_KEY }}
      PACKAGES_GPG_PASSPHRASE: ${{ secrets.PACKAGES_GPG_PASSPHRASE }}
      PACKAGES_DEPLOY_KEY: ${{ secrets.PACKAGES_DEPLOY_KEY }}

  # Stable releases only. A release candidate (a tag with a `-`, v1.2.0-rc1)
  # gets no GitHub Release, no assets and no announcement: it is built, its
  # images are pushed to GHCR, and the smoke test runs against them; the
  # Releases page lists only what was released. Its binaries go to GHCR as
  # well (`rc-binaries`).
  #
  # `darwin` is skipped for a release candidate, and a job that needs a
  # skipped job is skipped too unless it says otherwise: so this says what it
  # does need — every build that ran to have succeeded.
  # ── Release candidates: binaries on GHCR, not on the Releases page ──────
  #
  # A candidate gets no GitHub Release (see `publish`), so its binaries,
  # packages and checksums go to GHCR as one OCI artifact instead, at
  # `ghcr.io/<owner>/kividb-binaries:<tag>`, beside its images: anyone can
  # fetch them, with no sign-in, but nothing points people at them. With the
  # ORAS CLI: `oras pull ghcr.io/kividbio/kividb-binaries:v1.2.0-rc1`. Signed
  # like a release's files. Linux only: `darwin` is skipped for a candidate.
  rc-binaries:
    needs: [linux-amd64, linux-arm64]
    if: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Download the build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: dist-*
          merge-multiple: true

      - name: Assemble the files
        run: |
          set -euo pipefail
          mkdir -p rc-assets
          cp artifacts/* rc-assets/
          cd rc-assets
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -exec sha256sum {} \; | sort > SHA256SUMS.txt
          ls -l

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-checksums: rc-assets/SHA256SUMS.txt

      - name: Set up ORAS
        uses: oras-project/setup-oras@v1

      - name: Push to GHCR
        env:
          REPO: ghcr.io/${{ github.repository_owner }}/kividb-binaries
          SOURCE: https://github.com/${{ github.repository }}
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          cd rc-assets
          # The source label links the package to this repository, whose
          # visibility it takes.
          oras push "${REPO}:${RELEASE_TAG}" \
            --artifact-type application/vnd.kividb.binaries.v1 \
            --annotation "org.opencontainers.image.source=${SOURCE}" \
            --annotation "org.opencontainers.image.version=${RELEASE_TAG}" \
            --annotation "org.opencontainers.image.description=KiviDB ${RELEASE_TAG} binaries and packages (a release candidate)" \
            $(ls)
          echo "Pushed ${REPO}:${RELEASE_TAG}: oras pull ${REPO}:${RELEASE_TAG}"

  publish:
    needs: [linux-amd64, linux-arm64, darwin, docker-manifest, package-test]
    if: >-
      ${{ !cancelled()
          && !contains(github.event.inputs.tag || github.ref_name, '-')
          && needs.linux-amd64.result == 'success'
          && needs.linux-arm64.result == 'success'
          && needs.package-test.result == 'success'
          && needs.docker-manifest.result == 'success'
          && needs.darwin.result == 'success' }}
    runs-on: ubuntu-latest
    # pull-requests: read for the list of merged PRs on the release page;
    # id-token and attestations to sign the files' build provenance.
    permissions:
      contents: write
      pull-requests: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: dist-*
          merge-multiple: true

      - name: Assemble release directory
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp artifacts/* release-assets/
          cd release-assets
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -exec sha256sum {} \; | sort > SHA256SUMS.txt

      # Signed build provenance for every release file: that this exact file
      # was built by this workflow, from this commit (Sigstore, with the
      # workflow's own OIDC identity; no keys). SHA256SUMS.txt lists them all,
      # so the tarballs, .deb and .rpm are covered with no list to keep.
      # Anyone can check a download with
      # `gh attestation verify <file> --repo kividbio/kividb`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-checksums: release-assets/SHA256SUMS.txt

      # The release page: a heading, the release's own notes if it has them
      # (docs/releases/<tag>.md, written for people upgrading), then what
      # every release says, then the merged PRs (the next step).
      - name: Write release notes
        env:
          REPO_URL: https://github.com/${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          notes="docs/releases/${RELEASE_TAG}.md"
          {
            echo "## KiviDB ${RELEASE_TAG}"
            echo
            if [ -f "$notes" ]; then
              cat "$notes"
              echo
            else
              echo "No release notes were written for ${RELEASE_TAG} (\`$notes\`); see the changelog below."
              echo
            fi
            cat <<EOF
          ### Binary variants

          Each OS/architecture ships **four binaries** — pick the one that matches your needs:

          | Tarball suffix | Features included | When to use |
          |----------------|-------------------|-------------|
          | *(none)*       | —                 | Minimal / constrained environments |
          | \`-lua\`         | Lua scripting     | \`EVAL\` / \`EVALSHA\` |
          | \`-tls\`         | TLS termination   | Encrypted client connections |
          | \`-full\`        | Lua + TLS         | Recommended general-purpose build |

          **Full changelog:** [CHANGELOG.md](${REPO_URL}/blob/${DEFAULT_BRANCH}/CHANGELOG.md)

          **License:** [GNU Affero General Public License v3 (AGPL-3.0-only)](${REPO_URL}/blob/${DEFAULT_BRANCH}/LICENSE)

          **Code of conduct:** [CODE_OF_CONDUCT.md](${REPO_URL}/blob/${DEFAULT_BRANCH}/CODE_OF_CONDUCT.md)

          ---
          EOF
          } > release-body.md
          echo "release-body.md: $(wc -l < release-body.md) lines"

      # What GitHub would append on its own is the PRs since the newest tag
      # before this one, and for a stable release that is its last release
      # candidate: v1.1.0's page listed one PR. A release lists what was
      # merged since the previous *stable* release, candidates' tags passed
      # over. With no earlier stable release, everything. A release
      # withdrawn after it was published (.github/withdrawn-releases) is
      # passed over: its successor lists everything since the release before
      # it.
      - name: List the merged pull requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet
          # Every tag older than this one, oldest first. versionsort.suffix:
          # v1.1.0-rc2 sorts before v1.1.0, not after.
          older=$(git -c versionsort.suffix=- tag --list 'v*' --sort=v:refname \
            | awk -v t="${RELEASE_TAG}" '$0 == t { exit } { print }')
          withdrawn=$(grep -v -e '^#' -e '^[[:space:]]*$' .github/withdrawn-releases 2>/dev/null || true)
          previous=$(printf '%s\n' "$older" | grep -v -- - \
            | grep -vxF -f <(printf '%s\n' "${withdrawn:-//none//}") | tail -n 1 || true)
          {
            echo
            if [ -n "$previous" ]; then
              echo "Changes since ${previous}:"
              gh api "repos/${REPO}/releases/generate-notes" \
                -f tag_name="${RELEASE_TAG}" -f previous_tag_name="${previous}" --jq .body
            else
              echo "## What's Changed"
              gh pr list -R "${REPO}" --state merged --limit 1000 \
                --json number,title,author,url \
                --jq 'sort_by(.number) | .[] | "* \(.title) by @\(.author.login) in \(.url)"'
              echo
              echo "**Full Changelog**: every commit up to this release: https://github.com/${REPO}/commits/${RELEASE_TAG}"
            fi
          } >> release-body.md
          echo "previous release: ${previous:-none}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: false
          generate_release_notes: false
          body_path: release-body.md
          # No discussion_category_name: GitHub refuses to open a discussion in
          # Announcements with this token ("Discussion could not be created"),
          # which failed v1.2.0's publish job after the release was made and
          # skipped homebrew-tap-update. A maintainer posts the announcement.
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Source tag — stable releases only ───────────────────────────────────
  #
  # `X.Y.Z-src` on the release's commit, beside `vX.Y.Z`, so ports and
  # packagers that fetch GitHub's source tarball by tag (the FreeBSD port,
  # #319) find the same name for every release. 1.1.0-src to 1.2.0-src were
  # made by hand, on the old code plus the .gitattributes that leaves the raw
  # benchmark results out of source archives; from 1.2.1 on, the release's
  # own commit has it. No `v`, so the tag starts no release run.
  source-tag:
    needs: [linux-amd64, linux-arm64, darwin, docker-manifest, package-test]
    if: >-
      ${{ !cancelled()
          && !contains(github.event.inputs.tag || github.ref_name, '-')
          && needs.linux-amd64.result == 'success'
          && needs.linux-arm64.result == 'success'
          && needs.package-test.result == 'success'
          && needs.docker-manifest.result == 'success'
          && needs.darwin.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Push X.Y.Z-src on the release's commit
        run: |
          set -euo pipefail
          src="${RELEASE_TAG#v}-src"
          commit="$(git rev-parse HEAD)"
          # Tags are never moved: if it is there, it must already be this commit.
          have="$(git ls-remote origin "refs/tags/${src}^{}" | cut -f1)"
          if [ -n "${have}" ]; then
            if [ "${have}" = "${commit}" ]; then
              echo "${src} is already on ${commit}"
              exit 0
            fi
            echo "::error::${src} exists on ${have}, not on ${RELEASE_TAG} (${commit})"
            exit 1
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              tag -a "${src}" "${commit}" \
              -m "KiviDB ${RELEASE_TAG#v} source: the same commit as ${RELEASE_TAG}. Not a separate release."
          git push origin "refs/tags/${src}"
          echo "Pushed ${src} on ${commit}"

  # ── crates.io — stable releases only ────────────────────────────────────
  #
  # `cargo install kividb` and `cargo binstall kividb`. After the GitHub
  # Release, whose tarballs `cargo binstall` downloads (Cargo.toml's
  # [package.metadata.binstall]). `publish` runs for stable releases only, so
  # a candidate never gets here. Skipped with a notice while the
  # CARGO_REGISTRY_TOKEN secret is missing, and when crates.io already has
  # this version (a re-run): a version can be published only once. Setup
  # and withdrawal: docs/RELEASING.md.
  crates-io:
    needs: [publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check the token, and whether crates.io has this version
        id: cfg
        env:
          HAVE_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
        run: |
          set -euo pipefail
          ver="${RELEASE_TAG#v}"
          if [ "${HAVE_TOKEN}" != "true" ]; then
            echo "::notice::crates.io skipped: set the CARGO_REGISTRY_TOKEN secret to publish kividb ${ver} there."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # crates.io asks API clients for a User-Agent that says who they are.
          code="$(curl -s -o /dev/null -w '%{http_code}' \
            -A "kividb-release (https://github.com/${{ github.repository }})" \
            "https://crates.io/api/v1/crates/kividb/${ver}")"
          case "${code}" in
            200)
              echo "::notice::crates.io already has kividb ${ver}."
              echo "run=false" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "run=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::crates.io answered ${code} for kividb ${ver}"
              exit 1
              ;;
          esac

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.run == 'true'
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        if: steps.cfg.outputs.run == 'true'

      # Packs what Cargo.toml's `include` lists and builds that package as a
      # check, with no token in the environment: the build runs build
      # scripts of dependencies. --locked: with the Cargo.lock the release
      # was built with, which the crate carries.
      - name: cargo package
        if: steps.cfg.outputs.run == 'true'
        run: cargo package --locked

      # Uploads it. --no-verify: the step above built and checked the same
      # package. The only step that has the token.
      - name: cargo publish
        if: steps.cfg.outputs.run == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --no-verify

  # ── Smoke test — release candidates only ────────────────────────────────
  #
  # Runs after the images are published, so smoke-test.yml pulls the exact
  # images a user would get, not a source-tree build. (It used to wait for
  # the GitHub Release as well; a candidate no longer gets one, and the test
  # only pulls images.) Only fires for `-rc` tags (e.g. v1.0.4-rc1); a stable
  # tag skips this job entirely — the intent is to catch regressions on a
  # release candidate before it's promoted to a stable tag, not to gate every
  # stable release behind a ~15-20 minute workflow. `smoke-test.yml` stays
  # independently callable (workflow_dispatch) for ad-hoc runs against a
  # stable tag too, e.g. to bisect a regression.
  smoke-test:
    needs: [docker-manifest]
    # `uses:`-type (reusable-workflow-call) jobs only expose a restricted
    # context set here — no `env`, despite RELEASE_TAG being defined at
    # workflow level — so this repeats the same expression RELEASE_TAG
    # itself is assigned from at the top of this file, rather than
    # referencing it.
    #
    # `!cancelled()` and the result, spelled out: a candidate skips `darwin`
    # and `publish`, and a job with a skipped job anywhere before it is
    # skipped itself unless its condition says what it depends on.
    if: >-
      ${{ !cancelled()
          && needs.docker-manifest.result == 'success'
          && contains(github.event.inputs.tag || github.ref_name, '-rc') }}
    # A called workflow can only request permissions the calling job already
    # holds, and this file's workflow-level grant is `contents: write` alone —
    # which makes every other scope `none`, so smoke-test.yml's `packages: read`
    # is refused at parse time ("requesting 'packages: read', but is only
    # allowed 'packages: none'") and the whole file is reported invalid, not
    # just this job. Restating both scopes here is what grants them; keep this
    # in step with smoke-test.yml's own `permissions:` block.
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/smoke-test.yml
    with:
      version: ${{ github.event.inputs.tag || github.ref_name }}
    secrets: inherit
